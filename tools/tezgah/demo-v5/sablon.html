<style>

.none{margin-top:10px;width:100%;border:1px dashed #c7c7cc;background:transparent;border-radius:12px;padding:10px;font-size:13px;color:var(--mut);cursor:pointer}

.lvl{display:flex;gap:4px;margin:2px 0 10px}.lvl span{flex:1;font-size:10.5px;text-align:center;padding:4px 0;border-radius:8px;background:#f2f2f6;color:var(--mut);font-weight:600}.lvl span.on{background:var(--accl);color:var(--acc)}
.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.92);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line);
  padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:12px;z-index:50}
.bar .t{flex:1}.bar small{display:block;color:var(--mut);font-size:12px}.bar b{font-size:18px}
.bar button{height:46px;padding:0 20px;border:0;border-radius:14px;background:var(--acc);color:#fff;font-weight:700;cursor:pointer}

.toast.on{opacity:1;transform:translate(-50%,0)}
.view{animation:fade .3s ease}@keyframes fade{from{opacity:0}}
body.full{overflow:hidden}

.hint{display:none;position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:86;background:rgba(29,29,31,.78);color:#fff;font-size:12px;padding:6px 12px;border-radius:999px;white-space:nowrap}

@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}
@media(min-width:960px){
 main{padding:24px 18px 120px}h1{font-size:30px}.lead{font-size:14px}

 .tb{width:38px;height:38px}
 .sheet{left:50%;right:auto;bottom:50%;width:560px;border-radius:22px;transform:translate(-50%,58%) scale(.96);opacity:0;transition:transform .3s cubic-bezier(.2,.9,.25,1),opacity .2s;padding:18px 20px 20px}
 .sheet.on{transform:translate(-50%,50%);opacity:1}.sheet .grab{display:none}
}

<div class="top"><div><h1>Tezgâhını kur.</h1><p class="lead">Cihaza dokun, modelini seç. Eksikleri hemen gör.</p></div>
 <div class="seg" id="seg"><button data-v="tez" class="on">Tezgâh</button><button data-v="urun">Ürünler</button></div></div>
<div id="vTez" class="view">
 <div class="layout">
  <div><div class="stage" id="stage"><canvas id="cv"></canvas><div class="ov" id="ov"></div>
     <div class="help" id="help">Kaydır: döndür · İki parmak: yaklaş</div><div class="mode" id="mode"><button data-m="kur" class="on"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Kur</button><button data-m="bak"><svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>Sadece bak</button></div><div class="tools"><button class="tb" id="bTag" title="Etiketler"><svg viewBox="0 0 24 24"><path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1.3"/></svg></button>
     <button class="tb" id="bReset" title="Görünümü sıfırla"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4h4"/></svg></button>

<script>
const META=__META__, SLOTS=__SLOTS__, KALIP=__KALIP__;
const $=id=>document.getElementById(id), usd=v=>'$'+(Math.round(v*100)/100).toLocaleString('tr-TR');
const S=k=>SLOTS.find(s=>s.k===k), O=(k,id)=>S(k).opts.find(o=>o.id===id);
setTimeout(()=>{const h=document.getElementById('help');if(h)h.style.opacity=0},6000);
const pick={}; SLOTS.forEach(s=>pick[s.k]=s.tip==='coklu'?s.ilk.slice():s.tip==='adet'?{}:s.opts[0].id);
KALIP.slice(0,6).forEach(k=>pick.kalip[k[0]]=1);
const kcount=()=>Object.values(pick.kalip).reduce((a,b)=>a+b,0);
const klevel=n=>n<=0?0:n<=3?1:n<=10?2:n<=30?3:4;
const stage=$('stage'), cv=$('cv'), ov=$('ov');
let SCN=null, E=null;
const pills={}, tags={};
const FULL=()=>document.body.classList.contains('full');
// sahnedeki anahtarlar
function keysOf(k){const s=S(k),v=pick[k];
  if(s.tip==='tek')return v===null?[]:[k+'-'+v];
  if(s.tip==='coklu')return v.map((id,i)=>`${k}-${id}-${i}`);
  const l=klevel(kcount());return l?['kalip-'+l]:[];}
function empty(k){return keysOf(k).length===0}
function allKeys(){return SLOTS.flatMap(s=>keysOf(s.k))}
function ghostList(){return stage.classList.contains('bak')?[]:SLOTS.filter(s=>empty(s.k)).flatMap(s=>(SCN.ghost[s.k]||[]))}
function refresh(anim){if(!E)return;E.set(allKeys(),anim);E.ghosts(ghostList());overlay()}
// etiketler + boş yuva düğmeleri (her karede yeniden konumlanır)
function tagInfo(k){const s=S(k),v=pick[k];
  if(s.tip==='tek'){const o=O(k,v);return o?[s.ad,o.kisa]:null}
  if(s.tip==='coklu')return v.length?[s.ad,v.length===1?O(k,v[0]).kisa:v.length+' adet']:null;
  const n=kcount();return n?['Kalıplar',n+' adet']:null}
function overlay(){
  SLOTS.forEach(s=>{const k=s.k,info=tagInfo(k),tp=META.tags[k];let t=tags[k];
    if(info&&tp){if(!t){t=document.createElement('div');ov.appendChild(t);tags[k]=t}
      t.className='tag'+(tp.b?' b':'');t.innerHTML=`<div><small>${info[0]}</small><b>${info[1]}</b></div><i></i>`;t.dataset.on='1'}
    else if(t)t.dataset.on='';
    const need=empty(k)&&SCN.anchor[k];let p=pills[k];
    if(need&&!p){p=document.createElement('button');p.className='plus';p.textContent=s.ad;p.onclick=e=>{e.stopPropagation();openSheet(k)};ov.appendChild(p);pills[k]=p}
    if(!need&&p){p.remove();delete pills[k]}});
  place();declutter();
}
function place(){if(!E)return;
  SLOTS.forEach(s=>{const k=s.k,t=tags[k],tp=META.tags[k];
    if(t){if(t.dataset.on){const v=pick[k],w=(tp[String(v)]||tp['*']),q=E.project(w);t.style.display=q[2]>.05?'':'none';t.style.left=q[0]+'px';t.style.top=q[1]+'px'}else t.style.display='none'}
    const p=pills[k];if(p){const q=E.project(SCN.anchor[k]);p.style.left=q[0]+'px';p.style.top=q[1]+'px';p.style.display=q[2]>.05?'':'none'}});}
const TPRI=['mikro','havya','sicak','guc','termal','cimbiz','duman','tutucu','olcu','kalip','tornavida','keski','isitici','sivi','flux','dramel'];
let tagT=0;function declutter(){clearTimeout(tagT);tagT=setTimeout(()=>{const taken=[...document.querySelectorAll('.tools,.plus')].map(e=>e.getBoundingClientRect());
  const st=stage.getBoundingClientRect();
  TPRI.forEach(k=>{const t=tags[k];if(!t||t.style.display==='none')return;t.style.visibility='';const r=t.firstChild.getBoundingClientRect();
    const out=r.left<st.left-2||r.right>st.right+2||r.top<st.top-2||r.bottom>st.bottom+2;
    const hit=out||taken.some(q=>!(r.right+3<q.left||r.left-3>q.right||r.bottom+2<q.top||r.top-2>q.bottom));
    if(hit)t.style.visibility='hidden';else taken.push(r)})},80)}
function onTap(x,y){
  const regions=[];SLOTS.forEach(s=>{if(s.tip!=='tek'||empty(s.k))(SCN.ghost[s.k]||[]).forEach(g=>regions.push({id:s.k,pts:g[0]}))});
  const hit=E.pickAt(Math.round(x),Math.round(y),regions);if(!hit)return;
  const k=SLOTS.find(s=>hit===s.k||hit.startsWith(s.k+'-'));if(k)openSheet(k.k);
}
let moving=false;
function swap(k){refresh(true);if(k==='mikro')refresh(false)}
let undo=null;
function emptyAll(){undo=JSON.stringify(pick);SLOTS.forEach(s=>pick[s.k]=s.tip==='coklu'?[]:s.tip==='adet'?{}:null);refresh(true);render();
  const t=$('toast');t.innerHTML='Tezgâh boşaltıldı · <u style="cursor:pointer">Geri al</u>';t.style.pointerEvents='auto';t.classList.add('on');
  t.onclick=()=>{if(undo){Object.assign(pick,JSON.parse(undo));undo=null;refresh(true);render()}t.classList.remove('on')};
  clearTimeout(window._tt);window._tt=setTimeout(()=>{t.classList.remove('on');t.style.pointerEvents='none'},4000)}
function setPick(k,v){pick[k]=v;refresh(true);render()}
function lines(){
  return SLOTS.map(s=>{const v=pick[s.k];
    if(s.tip==='tek'){const o=O(s.k,v);return [s,o?[o]:[],o?o.n:'',o?o.p:0]}
    if(s.tip==='coklu'){const os=v.map(id=>O(s.k,id));return [s,os,os.length?os.map(o=>o.kisa).join(', '):'',os.reduce((a,o)=>a+o.p,0)]}
    const n=kcount(),t=Object.entries(v).reduce((a,[id,q])=>a+q*(KALIP.find(x=>x[0]==id)||[0,0,0])[2],0);return [s,n?[{id:'kalip'}]:[],n?n+' kalıp':'',t]});
}
function render(){
  const L=lines(),have=L.filter(l=>l[1].length),tot=L.reduce((a,l)=>a+l[3],0),miss=L.length-have.length,cnt=L.reduce((a,l)=>a+(l[0].tip==='adet'?kcount():l[1].length),0);
  $('prog').innerHTML=`<div>Tezgâh ${have.length}/${L.length}</div><div class="bar2"><b style="width:${have.length/L.length*100}%"></b></div>${miss?`<span>${miss} eksik</span>`:'<span>Tam ✓</span>'}${have.length?'<button class="clr" style="margin-left:4px" onclick="emptyAll()">Boşalt</button>':''}`;
  const th=l=>l[1].length?`<img src="img/p-${l[1][0].id}.webp" alt="">`:'<div class="ph">+</div>';
  const cn=l=>l[0].tip==='adet'?kcount():l[1].length;
  $('strip').innerHTML=L.map(l=>`<button class="it ${l[1].length?'':'miss'}" data-k="${l[0].k}">${th(l)}<div><b>${l[0].ad}</b><span>${l[1].length?(l[0].tip==='tek'?l[2]:cn(l)+' adet'):'Eksik · ekle'}</span></div></button>`).join('');
  $('side').innerHTML=`<h3 style="display:flex;align-items:baseline;gap:6px">Tezgâhın <span style="color:var(--mut);font-weight:600;font-size:13px">· ${have.length}/${L.length}${miss?` · <span style="color:var(--acc)">${miss} eksik</span>`:''}</span>${have.length?'<button class="clr" onclick="emptyAll()">Boşalt</button>':''}</h3>${L.map(l=>`<div class="row" data-k="${l[0].k}">${th(l)}<div class="t"><small>${l[0].ad}${l[0].tip!=='tek'&&l[1].length?' · '+cn(l)+' adet':''}</small>${l[1].length?`<div class="n">${l[2]}</div>`:'<div class="miss">Eksik · ekle</div>'}</div>${l[1].length?`<div class="p">${usd(l[3])}</div>`:''}</div>`).join('')}<div class="tot"><span>Toplam</span><span>${usd(tot)}</span></div><div class="note">Liste fiyatı (USD). Sepette TL ve KDV dahil hesaplanır.</div>`;
  $('grid').innerHTML=L.map((l,i)=>l[1].length?`<div class="card" data-k="${l[0].k}" style="animation-delay:${i*30}ms"><div class="im"><img src="img/p-${l[1][0].id}.webp" alt=""><span class="lab">${l[0].ad}</span>${l[0].tip!=='tek'?`<span class="cnt">${cn(l)} adet</span>`:''}</div><div class="b"><div class="n">${l[2]}</div><div class="f"><span class="p">${usd(l[3])}</span><span class="ch">Değiştir</span></div></div></div>`
     :`<div class="card miss" data-k="${l[0].k}" style="animation-delay:${i*30}ms"><div class="im"><div class="ph">+</div><span class="lab">${l[0].ad}</span></div><div class="b"><div class="n">${l[0].ad} eksik</div><div class="f"><span class="ch">Seç ve ekle</span></div></div></div>`).join('');
  document.querySelectorAll('#strip [data-k],#side [data-k],#grid [data-k]').forEach(b=>b.onclick=()=>openSheet(b.dataset.k));
  $('bc').textContent=cnt+' ürün · tezgâh toplamı';$('bt').textContent=usd(tot);
}
function openSheet(k){const s=S(k),sh=$('sheet');
  if(s.tip==='tek'){
    sh.innerHTML=`<div class="grab"></div><h2>${s.ad}</h2><p class="sub">${s.alt}</p><div class="opts">${s.opts.map(o=>`<button class="opt ${pick[k]===o.id?'on':''}" data-id="${o.id}"><div class="im"><img src="img/p-${o.id}.webp" alt=""></div><div class="b"><div class="n">${o.n}</div><div class="p">${usd(o.p)}</div><div class="st">${pick[k]===o.id?'✓ Tezgâhta':'Tezgâha koy'}</div></div></button>`).join('')}</div><button class="none">${pick[k]===null?'Bu yuva boş':'Tezgâhtan kaldır'}</button>`;
    sh.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{setPick(k,+b.dataset.id);closeSheet()});
    sh.querySelector('.none').onclick=()=>{setPick(k,null);closeSheet()};
  } else if(s.tip==='coklu'){
    const draw=()=>{const v=pick[k];sh.innerHTML=`<div class="grab"></div><h2>${s.ad}</h2><p class="sub">${s.alt} <b style="color:var(--ink)">${v.length}/4 dolu</b></p><div class="opts">${s.opts.map(o=>{const on=v.includes(o.id),dis=!on&&v.length>=4;return `<button class="opt ${on?'on':''} ${dis?'dis':''}" data-id="${o.id}"><div class="im"><img src="img/p-${o.id}.webp" alt=""></div><div class="b"><div class="n">${o.n}</div><div class="p">${usd(o.p)}</div><div class="st">${on?'✓ Yerinde · kaldır':dis?'Yer dolu':s.ekle}</div></div></button>`}).join('')}</div><button class="ok">Tamam</button>`;
      sh.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const id=+b.dataset.id,v=pick[k];if(v.includes(id))pick[k]=v.filter(x=>x!==id);else if(v.length<4)pick[k]=[...v,id];else return;refresh(true);render();draw()});
      sh.querySelector('.ok').onclick=closeSheet};
    draw();
  } else {
    let q='';
    sh.innerHTML=`<div class="grab"></div><h2>Kalıplar</h2><p class="sub">Rafta üst üste durur; çoğaldıkça deste kalınlaşır.</p><div class="lvl"><span>1–3</span><span>4–10</span><span>11–30</span><span>30+</span></div><input class="srch" placeholder="Kalıp ara: A13, S22, iPad…"><div class="kinfo"></div><div class="klist"></div><button class="ok">Tamam</button>`;
    const draw=()=>{const n=kcount(),l=klevel(n),f=q.trim().toLocaleLowerCase('tr'),list=KALIP.filter(x=>!f||x[1].toLocaleLowerCase('tr').includes(f)),sel=list.filter(x=>pick.kalip[x[0]]),rest=list.filter(x=>!pick.kalip[x[0]]);
      sh.querySelector('.klist').innerHTML=[...sel,...rest].slice(0,150).map(x=>{const c=pick.kalip[x[0]]||0;return `<div class="kr ${c?'on':''}"><div class="n">${x[1]}</div><div class="p">${usd(x[2])}</div>${c?`<button data-m="${x[0]}">−</button><span class="q">${c}</span>`:''}<button class="add" data-a="${x[0]}">+</button></div>`}).join('')||'<p class="note">Bulunamadı.</p>';
      sh.querySelector('.kinfo').innerHTML=`<span>Sitedeki tek kalıplar · ${KALIP.length} çeşit</span><b>${n} kalıp seçili</b>`;
      sh.querySelectorAll('.lvl span').forEach((e,i)=>e.classList.toggle('on',i+1===l));
      sh.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{const id=b.dataset.a;pick.kalip[id]=(pick.kalip[id]||0)+1;refresh(true);render();draw()});
      sh.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{const id=b.dataset.m;if(--pick.kalip[id]<=0)delete pick.kalip[id];refresh(true);render();draw()});};
    sh.querySelector('.srch').oninput=e=>{q=e.target.value;draw()};sh.querySelector('.ok').onclick=closeSheet;draw();
  }
  $('dim').classList.add('on');sh.classList.add('on');
}
function closeSheet(){$('dim').classList.remove('on');$('sheet').classList.remove('on')}
$('dim').onclick=closeSheet;
$('seg').querySelectorAll('button').forEach(b=>b.onclick=()=>{$('seg').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));
  const u=b.dataset.v==='urun';$('vTez').classList.toggle('hide',u);$('vUrun').classList.toggle('hide',!u);render();scrollTo({top:0,behavior:'smooth'})});
$('bTag').onclick=()=>{stage.classList.toggle('notags');$('bTag').classList.toggle('off')};
function setMode(m){stage.classList.toggle('bak',m==='bak');$('mode').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.m===m));refresh(false)}
$('mode').querySelectorAll('button').forEach(b=>b.onclick=()=>setMode(b.dataset.m));
function setFull(on){document.body.classList.toggle('full',on);$('iFull').innerHTML=on?'<path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/>':'<path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>';
  try{if(on&&document.documentElement.requestFullscreen&&!document.fullscreenElement)document.documentElement.requestFullscreen().catch(()=>{});if(!on&&document.fullscreenElement)document.exitFullscreen()}catch(e){}
  setTimeout(()=>{E&&E.resize();place();declutter()},50)}
$('bFull').onclick=()=>{const on=!FULL();setFull(on);setMode(on?'bak':'kur')};$('bReset').onclick=()=>E&&E.reset();
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&FULL())setFull(false)});
addEventListener('keydown',e=>{if(e.key==='Escape'){closeSheet();if(FULL())setFull(false)}});
$('badd').onclick=()=>{const add={};SLOTS.forEach(s=>{const v=pick[s.k];
    if(s.tip==='tek'){if(v!==null)add[v]=(add[v]||0)+1}else if(s.tip==='coklu')v.forEach(id=>add[id]=(add[id]||0)+1);else Object.entries(v).forEach(([id,q])=>add[id]=(add[id]||0)+q)});
  if(!Object.keys(add).length){const t=$('toast');t.textContent='Tezgâhta ürün yok';t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1500);return}
  try{sessionStorage.setItem('tezgah-ekle',JSON.stringify(add))}catch(e){}
  location.href='/sepet'};
render();
fetch('scene.json').then(r=>r.json()).then(d=>{SCN=d;
  E=Tezgah.init(cv,SCN,{view:matchMedia('(min-width:960px)').matches?{dist:1.8,ty:.97}:{dist:1.55,ty:.98,tx:-.03},onTap,onFrame:mv=>{place();if(mv!==moving){moving=mv;stage.classList.toggle('moving',mv);if(!mv)declutter()}}});
  const ks=allKeys();ks.forEach((k,i)=>setTimeout(()=>E.set(ks.slice(0,i+1),true),200+i*55));
  E.ghosts(ghostList());overlay();
  addEventListener('resize',()=>{place();declutter()});
});
</script></body></html>
