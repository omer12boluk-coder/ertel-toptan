.none{margin-top:10px;width:100%;border:1px dashed #c7c7cc;background:transparent;border-radius:12px;padding:10px;font-size:13px;color:var(--mut);cursor:pointer}

.view{animation:fade .3s ease}@keyframes fade{from{opacity:0}}

}

    sh.innerHTML=`<div class="grab"></div><h2>Kalıplar</h2><p class="sub">Rafta üst üste durur; çoğaldıkça deste kalınlaşır.</p><div class="lvl"><span>1–3</span><span>4–10</span><span>11–30</span><span>30+</span></div><input class="srch" placeholder="Kalıp ara: A13, S22, iPad…"><div class="kinfo"></div><div class="klist"></div><button class="ok">Tamam</button>`;
    const draw=()=>{const n=kcount(),l=klevel(n),f=q.trim().toLocaleLowerCase('tr'),list=KALIP.filter(x=>!f||x[1].toLocaleLowerCase('tr').includes(f)),sel=list.filter(x=>pick.kalip[x[0]]),rest=list.filter(x=>!pick.kalip[x[0]]);
      sh.querySelector('.klist').innerHTML=[...sel,...rest].slice(0,150).map(x=>{const c=pick.kalip[x[0]]||0;return `<div class="kr ${c?'on':''}"><div class="n">${x[1]}</div><div class="p">${usd(x[2])}</div>${c?`<button data-m="${x[0]}">−</button><span class="q">${c}</span>`:''}<button class="add" data-a="${x[0]}">+</button></div>`}).join('')||'<p class="note">Bulunamadı.</p>';
      sh.querySelector('.kinfo').innerHTML=`<span>Sitedeki tek kalıplar · ${KALIP.length} çeşit</span><b>${n} kalıp seçili</b>`;
      sh.querySelectorAll('.lvl span').forEach((e,i)=>e.classList.toggle('on',i+1===l));
      sh.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{const id=b.dataset.a;pick.kalip[id]=(pick.kalip[id]||0)+1;refresh(true);render();draw()});
      sh.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{const id=b.dataset.m;if(--pick.kalip[id]<=0)delete pick.kalip[id];refresh(true);render();draw()});};
    sh.querySelector('.srch').oninput=e=>{q=e.target.value;draw()};sh.querySelector('.ok').onclick=closeSheet;draw();
  }
  $('dim').classList.add('on');sh.classList.add('on');
}
function closeSheet(){$('dim').classList.remove('on');$('sheet').classList.remove('on')}
$('dim').onclick=closeSheet;
$('seg').querySelectorAll('button').forEach(b=>b.onclick=()=>{$('seg').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));
  const u=b.dataset.v==='urun';$('vTez').classList.toggle('hide',u);$('vUrun').classList.toggle('hide',!u);render();scrollTo({top:0,behavior:'smooth'})});
$('bTag').onclick=()=>{stage.classList.toggle('notags');$('bTag').classList.toggle('off')};
function setMode(m){stage.classList.toggle('bak',m==='bak');$('mode').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.m===m));refresh(false)}
$('mode').querySelectorAll('button').forEach(b=>b.onclick=()=>setMode(b.dataset.m));
function setFull(on){document.body.classList.toggle('full',on);$('iFull').innerHTML=on?'<path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/>':'<path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>';
  try{if(on&&document.documentElement.requestFullscreen&&!document.fullscreenElement)document.documentElement.requestFullscreen().catch(()=>{});if(!on&&document.fullscreenElement)document.exitFullscreen()}catch(e){}
  setTimeout(()=>{E&&E.resize();place();declutter()},50)}
$('bFull').onclick=()=>{const on=!FULL();setFull(on);setMode(on?'bak':'kur')};$('bReset').onclick=()=>E&&E.reset();
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&FULL())setFull(false)});
addEventListener('keydown',e=>{if(e.key==='Escape'){closeSheet();if(FULL())setFull(false)}});
$('badd').onclick=()=>{const add={};SLOTS.forEach(s=>{const v=pick[s.k];
    if(s.tip==='tek'){if(v!==null)add[v]=(add[v]||0)+1}else if(s.tip==='coklu')v.forEach(id=>add[id]=(add[id]||0)+1);else Object.entries(v).forEach(([id,q])=>add[id]=(add[id]||0)+q)});
  if(!Object.keys(add).length){const t=$('toast');t.textContent='Tezgâhta ürün yok';t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1500);return}
  try{sessionStorage.setItem('tezgah-ekle',JSON.stringify(add))}catch(e){}
  location.href='/sepet'};
render();
fetch('scene.json').then(r=>r.json()).then(d=>{SCN=d;
  E=Tezgah.init(cv,SCN,{view:matchMedia('(min-width:960px)').matches?{dist:1.8,ty:.97}:{dist:1.55,ty:.98,tx:-.03},onTap,onFrame:mv=>{place();if(mv!==moving){moving=mv;stage.classList.toggle('moving',mv);if(!mv)declutter()}}});
  const ks=allKeys();ks.forEach((k,i)=>setTimeout(()=>E.set(ks.slice(0,i+1),true),200+i*55));
  E.ghosts(ghostList());overlay();
  addEventListener('resize',()=>{place();declutter()});
});
</script></body></html>
