.she-img-r { display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 220px; align-items: flex-start; }
.she-link { display: flex; gap: 8px; flex-wrap: wrap; } .she-link > * { flex: 1 1 160px; }
.she-color { display: flex; align-items: center; gap: 8px; } .she-color input { width: 54px; padding: 3px; min-height: 42px; } .she-color code { color: var(--muted); }
.she-ps { position: relative; width: 100%; }
.she-ps-res { list-style: none; margin: 4px 0 0; padding: 4px; position: absolute; z-index: 20; left: 0; right: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); max-height: 300px; overflow: auto; }
.she-ps-res button { width: 100%; display: flex; align-items: center; gap: 10px; padding: 6px; border-radius: 8px; text-align: left; font-size: 13px; }
.she-ps-res button:hover { background: var(--surface-2); }
.she-ps-res small { display: block; color: var(--muted); }
.she-chips { display: flex; flex-direction: column; gap: 6px; }
.she-chip { display: inline-flex; align-items: center; gap: 8px; padding: 4px 6px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); font-size: 13px; }
.she-chip .thumb { width: 30px; height: 30px; }
.she-chip button { margin-left: auto; color: var(--muted); }
/* ürün resmiyle reklam: beyaz kart içinde, eğik ve süzülen */
.sh-pcard { position: relative; width: min(82%, 400px); aspect-ratio: 1; padding: 22px; border-radius: 30px; background: #fff; box-shadow: 0 40px 70px -30px rgb(0 0 0 / .7), 0 0 0 10px rgb(255 255 255 / .06); transform: rotate(-4deg); animation: float 6s ease-in-out infinite; }
.sh-pcard img { width: 100%; height: 100%; object-fit: contain; border-radius: 14px; }
.sh-pcard::after { content: ""; position: absolute; inset: -30px; z-index: -1; border-radius: 50%; background: radial-gradient(circle, color-mix(in oklab, var(--g1) 55%, transparent), transparent 65%); filter: blur(20px); }
.sh-box.prod { align-items: stretch; flex-direction: column; justify-content: flex-end; }
.sh-box-prod { position: absolute; z-index: -1; top: 10%; right: 8%; width: 56%; aspect-ratio: 1; padding: 10px; border-radius: 20px; background: #fff; box-shadow: 0 24px 40px -20px rgb(0 0 0 / .55); transform: rotate(5deg); transition: transform .5s var(--spring); }
.sh-box-prod img { width: 100%; height: 100%; object-fit: contain; border-radius: 12px; }
.sh-box.prod.sz-wide .sh-box-prod { width: auto; height: 74%; top: 13%; right: 6%; }
.sh-box.prod.sz-tall .sh-box-prod { width: 74%; top: 8%; right: 13%; }
.sh-box.prod.sz-big .sh-box-prod { width: 58%; top: 8%; right: 7%; }
.sh-box.prod .sh-box-t { max-width: 60%; }
.sh-box.prod.sz-tall .sh-box-t, .sh-box.prod.sz-big .sh-box-t { max-width: 92%; }
@media (hover: hover) { .sh-box.prod:hover .sh-box-prod { transform: rotate(0deg) scale(1.06); } }
.sh-box.notext .sh-box-shade { opacity: 0 !important; }
.sh-box.has-img.notext { background: #fff; box-shadow: inset 0 0 0 1px var(--line); }
.sh-box.has-img.notext::before { display: none; }
.sh-box.has-img.notext .sh-box-img { object-fit: contain; }
.sh-box.prod.sz-sq .sh-box-t { max-width: 100%; }
@media (max-width: 700px) { .sh-box.prod.sz-sq .sh-box-prod { width: 52%; top: 8%; right: 7%; } .sh-box.prod .sh-box-t { max-width: 100%; } .sh-pcard { width: 70%; padding: 14px; border-radius: 22px; } }
/* orijinal logolar */
.sh-mq-logo { height: 30px; width: auto; max-width: 180px; object-fit: contain; filter: brightness(0) invert(1); opacity: .95; }
.sh-marquee span:has(.sh-mq-logo) { -webkit-text-stroke: 0; }
.sh-brand.has-logo .sh-brand-logo { max-width: 68%; max-height: 34%; filter: drop-shadow(0 4px 10px rgb(0 0 0 / .18)); }
.sh-brand.light { color: #0f172a; background: radial-gradient(120% 90% at 0% 0%, #fff 0%, #f7f9fc 60%, #edf1f7 100%); box-shadow: inset 0 0 0 1px var(--line), 0 14px 28px -22px rgb(10 20 40 / .4); }
.sh-brand.light::before { background-image: radial-gradient(rgb(15 23 42 / .08) 1px, transparent 1.4px); }
.sh-brand.light .sh-brand-glow { background: radial-gradient(220px circle at var(--mx, 50%) var(--my, 50%), color-mix(in oklab, var(--accent) 16%, transparent), transparent 60%); }
.sh-brand.light .sh-brand-logo { filter: none; }
.sh-brand.light .sh-brand-f { opacity: .65; }
.sh-brand.light .sh-brand-arrow { background: var(--accent-soft); color: var(--accent); }
[data-theme="dark"] .sh-brand.light { box-shadow: inset 0 0 0 1px rgb(255 255 255 / .1); }
.sh-brands { grid-template-columns: repeat(5, minmax(0, 1fr)); }
@media (max-width: 900px) { .sh-brands { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
@media (max-width: 700px) {
  .sh-brands { display: grid; grid-auto-flow: column; grid-template-columns: none; grid-template-rows: repeat(2, auto); grid-auto-columns: 38%; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; margin-inline: -16px; padding: 4px 16px 10px; }
  .sh-brands::-webkit-scrollbar { display: none; } .sh-brand { scroll-snap-align: start; }
  .sh-mq-logo { height: 24px; }
}
/* reklamda marka logosu */
.sh-slide-logo { align-self: flex-start; display: inline-flex; align-items: center; height: 54px; padding: 10px 18px; border-radius: 16px; background: #fff; box-shadow: 0 12px 30px -14px rgb(0 0 0 / .55), 0 0 0 1px rgb(255 255 255 / .2); }
.sh-slide-logo img { height: 100%; width: auto; max-width: 200px; object-fit: contain; }
@media (max-width: 700px) { .sh-slide-logo { height: 44px; padding: 8px 14px; } }
/* marka kutuları: hepsi aynı beyaz zemin */
.sh-brand.has-logo .sh-brand-logo { max-width: 70%; max-height: 40%; filter: none; }
.sh-marquee:hover .sh-marquee-in { animation-play-state: running; }
/* üst menü: ayrı ve belirgin sepet */
.top-sp { flex: 1; }
.shell .me { margin-left: 0; }
.hcart { display: inline-flex; align-items: center; gap: 10px; height: 44px; padding: 0 14px 0 8px; border-radius: 22px; border: 1px solid var(--line); background: var(--surface); transition: background .15s, border-color .15s, transform .12s; }
.hcart:hover { border-color: color-mix(in oklab, var(--accent) 50%, var(--line)); }
.hcart.full { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); box-shadow: 0 8px 20px -10px var(--accent); }
.hcart.on:not(.full) { background: var(--accent-soft); }
.hcart-ic { position: relative; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; }
.hcart.full .hcart-ic { background: rgb(255 255 255 / .18); }
.hcart-ic b { position: absolute; top: -5px; right: -7px; min-width: 19px; height: 19px; padding: 0 5px; border-radius: 10px; display: grid; place-items: center; background: var(--price); color: #fff; font: 700 11px/1 var(--f-body); box-shadow: 0 0 0 2px var(--surface); animation: pop .35s var(--spring); }
.hcart-t { display: flex; flex-direction: column; line-height: 1.1; text-align: left; }
.hcart-t b { font-size: 14px; } .hcart-t small { font-size: 12px; opacity: .8; font-variant-numeric: tabular-nums; }
@media (max-width: 899px) { .hcart { height: 40px; padding: 0 6px; } .hcart-t { display: none; } .shell:not(.admin) .to-landing { display: none; } }
/* sağ altta küçük sepet */
.cart-fab { position: fixed; z-index: 30; right: max(18px, env(safe-area-inset-right, 0px)); bottom: calc(var(--bot-h) + env(safe-area-inset-bottom, 0px) + 14px); display: inline-flex; align-items: center; gap: 8px; height: 54px; padding: 0 16px 0 7px; border-radius: 27px; background: var(--accent); color: var(--accent-ink); box-shadow: 0 14px 30px -12px color-mix(in oklab, var(--accent) 80%, #000); animation: rise .35s var(--spring) backwards; transition: transform .2s var(--ease); }
.cart-fab:hover { transform: translateY(-2px); }
.cart-fab-ic { position: relative; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: rgb(255 255 255 / .18); }
.cart-fab-ic b { position: absolute; top: -4px; right: -4px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 10px; display: grid; place-items: center; background: var(--price); color: #fff; font: 700 11px/1 var(--f-body); box-shadow: 0 0 0 2px var(--accent); animation: pop .35s var(--spring); }
.cart-fab-t { font: 700 16px/1 var(--f-display); font-variant-numeric: tabular-nums; }
@media (min-width: 900px) { .cart-fab { bottom: 24px; right: 24px; } }
.shell:not(.admin) .catalog { padding-bottom: 20px; }
/* açılır listelerde seçenekler her zaman okunur (seçili koyu çipte bile) */
select option, select optgroup { color: #131a2b; background: #fff; }
[data-theme="dark"] select option { color: #e4e9f3; background: #151c2c; }
/* seçili filtreler */
.af-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.af-chip { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 8px 0 12px; border-radius: 15px; background: var(--accent); color: var(--accent-ink); font-size: 13px; font-weight: 600; transition: background .15s, transform .12s; }
.af-chip:hover { background: color-mix(in oklab, var(--accent) 85%, black); }
.af-chip .ic { opacity: .85; }
.af-clear { font-size: 13px; margin-left: 4px; }
.banner.widen { margin: 0; align-items: center; flex-wrap: wrap; }
.banner.widen > div { flex: 1; min-width: 200px; }
/* logolu marka kutuları: markanın kendi renginden beyaza geçen açık zemin, logo kendi renginde okunur */
.sh-brand.has-logo { color: color-mix(in oklab, var(--c) 70%, #000);
  background: radial-gradient(120% 100% at 100% 0%, color-mix(in oklab, var(--c) 34%, #fff) 0%, color-mix(in oklab, var(--c) 12%, #fff) 48%, #fff 100%);
  box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--c) 22%, #fff), 0 16px 30px -22px var(--c); }
.sh-brand.has-logo::before { background-image: radial-gradient(color-mix(in oklab, var(--c) 30%, transparent) 1px, transparent 1.5px); -webkit-mask-image: linear-gradient(225deg, #000, transparent 55%); mask-image: linear-gradient(225deg, #000, transparent 55%); }
.sh-brand.has-logo::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 5px; background: linear-gradient(90deg, var(--c), color-mix(in oklab, var(--c) 45%, #fff)); }
.sh-brand.has-logo .sh-brand-glow { background: radial-gradient(220px circle at var(--mx, 50%) var(--my, 50%), color-mix(in oklab, var(--c) 22%, transparent), transparent 62%); }
.sh-brand.has-logo .sh-brand-f { opacity: .8; font-weight: 700; }
.sh-brand.has-logo .sh-brand-arrow { background: var(--c); color: #fff; }
.sh-brand.has-logo .sh-brand-logo.sq { max-height: 52%; max-width: 60%; }
.sh-slide { isolation: isolate; }
input[type="search"]::-webkit-search-cancel-button { -webkit-appearance: none; appearance: none; display: none; }
.hcart.full { padding-left: 10px; }
