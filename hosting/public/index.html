<style>/* Layout: mobile-first app shell. Top bar + bottom tab bar on phones; top bar with inline tabs on desktop.
   Catalog = dense parts-bin list (thumb · name/SKU · price tag · add). Requests = list + thread split on desktop. */
:root {
  --accent: var(--accent-user, #2f55b0);
  --accent-ink: #ffffff;
  --accent-soft: color-mix(in oklab, var(--accent) 12%, var(--surface));
  --price: var(--price-user, #c2410c);
  --price-soft: color-mix(in oklab, var(--price) 13%, var(--surface));
  --bg: #f1f4f9;
  --surface: #ffffff;
  --surface-2: #f5f7fb;
  --fg: #131a2b;
  --muted: #5b6478;
  --line: #d6dce8;
  --line-2: #e7ebf2;
  --ok: #157f3c;
  --warn: #b45309;
  --bad: #b42318;
  --info: #1d5bd8;
  --shadow: 0 1px 2px rgb(16 32 26 / .06), 0 6px 24px rgb(16 32 26 / .07);
  --f-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  --f-body: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 10px;
  --r-sm: 7px;
  --top-h: 58px;
  --bot-h: 64px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --accent: color-mix(in oklab, var(--accent-user, #2f55b0) 60%, #ffffff);
    --accent-ink: #04130f;
    --price: color-mix(in oklab, var(--price-user, #c2410c) 55%, #ffe7a8);
    --bg: #0d1220; --surface: #151c2c; --surface-2: #1a2336; --fg: #e4e9f3; --muted: #95a0b6; --line: #2a3448; --line-2: #212a3c;
    --ok: #4ccf7f; --warn: #f2b45a; --bad: #ff7b6e; --info: #7ea8ff;
    --shadow: 0 1px 2px rgb(0 0 0 / .4), 0 8px 28px rgb(0 0 0 / .35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --accent: color-mix(in oklab, var(--accent-user, #2f55b0) 60%, #ffffff);
  --accent-ink: #04130f;
  --price: color-mix(in oklab, var(--price-user, #c2410c) 55%, #ffe7a8);
  --bg: #0d1220; --surface: #151c2c; --surface-2: #1a2336; --fg: #e4e9f3; --muted: #95a0b6; --line: #2a3448; --line-2: #212a3c;
  --ok: #4ccf7f; --warn: #f2b45a; --bad: #ff7b6e; --info: #7ea8ff;
  --shadow: 0 1px 2px rgb(0 0 0 / .4), 0 8px 28px rgb(0 0 0 / .35);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 var(--f-body); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
body.noscroll { overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
button:disabled { cursor: not-allowed; opacity: .5; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input, select, textarea { width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 10px 12px; min-height: 42px; }
textarea { resize: vertical; min-height: 0; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in oklab, var(--accent) 22%, transparent); }
code { font-family: var(--f-mono); font-size: .8em; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.fine { color: var(--muted); font-size: 13px; margin: 0; text-wrap: pretty; }
.center { text-align: center; }
.err { color: var(--bad); font-size: 14px; margin: 0; }
.eyebrow { font: 600 11px/1 var(--f-body); letter-spacing: .09em; text-transform: uppercase; color: var(--muted); margin: 0; }
.ic { flex: none; }
h1, h2, h3 { text-wrap: balance; }

/* ---------- buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 42px; padding: 0 16px; border-radius: var(--r-sm); font-weight: 600; border: 1px solid transparent; white-space: nowrap; transition: background .15s, border-color .15s; }
.btn.sm { min-height: 34px; padding: 0 11px; font-size: 14px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.primary:hover:not(:disabled) { background: color-mix(in oklab, var(--accent) 88%, black); }
.btn.outline { border-color: color-mix(in oklab, var(--accent) 55%, var(--line)); color: var(--accent); background: var(--surface); }
.btn.outline:hover { background: var(--accent-soft); }
.btn.ghost { color: var(--fg); }
.btn.ghost:hover { background: var(--surface-2); }
.btn.danger, .link.danger { color: var(--bad); }
.btn.btn.danger.primary, .btn.danger:not(.ghost):not(.outline) { background: var(--bad); color: #fff; }
.btn.icon { width: 44px; padding: 0; }
.btn.add { background: var(--accent-soft); color: var(--accent); }
.btn.add:hover { background: var(--accent); color: var(--accent-ink); }
.btn.big { min-height: 56px; justify-content: flex-start; padding: 0 16px; gap: 12px; white-space: normal; text-align: left; }
.btn.big span { display: flex; flex-direction: column; line-height: 1.2; }
.btn.big small { font-weight: 500; opacity: .8; font-size: 13px; }
.btn small { font-weight: 500; opacity: .75; font-size: 12px; }
.icon-btn { display: inline-grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; color: var(--muted); }
.icon-btn:hover { background: var(--surface-2); color: var(--fg); }
.icon-btn.sm { width: 32px; height: 32px; }
.link { color: var(--accent); font-weight: 600; font-size: 14px; }
.badge { display: inline-grid; place-items: center; min-width: 19px; height: 19px; padding: 0 5px; border-radius: 10px; background: var(--bad); color: #fff; font: 700 11px/1 var(--f-body); font-variant-numeric: tabular-nums; }
.badge.soft { background: var(--accent-soft); color: var(--accent); }

/* ---------- chips */
.chips { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.chips.scroll { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin-inline: -16px; padding-inline: 16px; }
.chips.scroll::-webkit-scrollbar { display: none; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: 17px; border: 1px solid var(--line); background: var(--surface); font-size: 14px; font-weight: 500; white-space: nowrap; flex: none; }
.chip b { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.chip.on { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.chip.on b { color: inherit; opacity: .7; }
.chip.accent { border-color: var(--accent); color: var(--accent); }
.chip.select { padding-right: 4px; position: relative; }
.chip.select select { border: 0; background: transparent; padding: 0 22px 0 0; min-height: 0; height: 30px; width: auto; box-shadow: none; font-weight: 500; }

/* ---------- pills / tones */
.pill { display: inline-flex; align-items: center; height: 22px; padding: 0 9px; border-radius: 11px; font: 600 12px/1 var(--f-body); white-space: nowrap; flex: none; }
.tone-ok { --t: var(--ok); } .tone-warn { --t: var(--warn); } .tone-bad { --t: var(--bad); } .tone-info { --t: var(--info); } .tone-muted { --t: var(--muted); }
.pill { color: var(--t); background: color-mix(in oklab, var(--t) 13%, var(--surface)); }
.dot { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--t); font-weight: 600; }
.dot::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--t); }
.tag { display: inline-flex; height: 22px; align-items: center; padding: 0 8px; border-radius: 5px; background: var(--surface-2); border: 1px solid var(--line-2); font-size: 12px; font-weight: 600; color: var(--muted); }
.tag.warn { color: var(--warn); border-color: color-mix(in oklab, var(--warn) 35%, var(--line)); }
.tag.bad { color: var(--bad); }

/* ---------- shell */
.shell { min-height: 100%; padding-bottom: calc(var(--bot-h) + env(safe-area-inset-bottom, 0px)); }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.topbar-in { display: flex; align-items: center; gap: 12px; height: var(--top-h); max-width: 1320px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brand { display: inline-flex; align-items: center; gap: 10px; min-width: 0; }
.brand img, .brand-mark { width: 34px; height: 34px; border-radius: 8px; flex: none; object-fit: cover; }
.brand-mark { display: grid; place-items: center; background: var(--accent); color: var(--accent-ink); font: 700 21px/1 var(--f-display); }
.brand-t { display: flex; flex-direction: column; line-height: 1.05; min-width: 0; }
.brand-t b { font: 700 20px/1 var(--f-display); letter-spacing: .01em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand-t small { color: var(--muted); font-size: 13px; margin-top: 3px; }
.topnav { display: none; gap: 4px; margin-left: 18px; }
.topnav-b { display: inline-flex; align-items: center; gap: 7px; height: 38px; padding: 0 13px; border-radius: 8px; font-weight: 600; color: var(--muted); position: relative; }
.topnav-b:hover { color: var(--fg); background: var(--surface-2); }
.topnav-b.on { color: var(--accent); background: var(--accent-soft); }
.topnav-b .badge { margin-left: 2px; }
.me { margin-left: auto; display: inline-flex; align-items: center; gap: 10px; padding: 3px; border-radius: 22px; }
.me-t { display: none; flex-direction: column; text-align: right; line-height: 1.15; }
.me-t small { color: var(--muted); font-size: 12px; }
.botnav { position: fixed; z-index: 20; left: 0; right: 0; bottom: 0; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.botnav-b { height: var(--bot-h); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 12px; font-weight: 600; color: var(--muted); }
.botnav-b.on { color: var(--accent); }
.botnav-i { position: relative; display: grid; place-items: center; width: 52px; height: 30px; border-radius: 15px; }
.botnav-b.on .botnav-i { background: var(--accent-soft); }
.botnav-i .badge { position: absolute; top: -4px; right: 4px; }
.main { max-width: 1320px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 14px 24px; }
.demo-strip { display: flex; align-items: center; gap: 10px; justify-content: space-between; max-width: 1320px; margin: 10px auto 0; padding: 8px 8px 8px 14px; border: 1px dashed color-mix(in oklab, var(--warn) 50%, var(--line)); border-radius: var(--r-sm); background: color-mix(in oklab, var(--warn) 7%, var(--surface)); font-size: 13px; margin-inline: max(16px, env(safe-area-inset-left, 0px)); }
.only-m { }
.hide-s { display: none; }

@media (min-width: 900px) {
  .shell { padding-bottom: 0; }
  .botnav { display: none; }
  .topnav { display: flex; }
  .me-t { display: flex; }
  .only-m { display: none !important; }
  .hide-s { display: revert; }
  .main { padding-block: 22px 40px; }
  .demo-strip { margin-inline: auto; width: calc(100% - 32px); }
}
@media (min-width: 560px) { .hide-s { display: revert; } }

.page { display: flex; flex-direction: column; gap: 14px; }
.page.narrow { max-width: 680px; margin: 0 auto; width: 100%; }
.page-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.page-t { font: 700 26px/1.1 var(--f-display); margin: 0; letter-spacing: .005em; }
.page-t .muted { font-weight: 600; }

/* ---------- search / toolbar */
.search { position: relative; display: flex; align-items: center; }
.search > .ic { position: absolute; left: 13px; color: var(--muted); pointer-events: none; }
.search input { padding-left: 40px; padding-right: 40px; min-height: 48px; font-size: 16px; border-radius: var(--r); }
.search.sm input { min-height: 40px; font-size: 15px; }
.search .icon-btn { position: absolute; right: 6px; }
.toolbar { display: flex; flex-direction: column; gap: 10px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--top-h)); z-index: 10; background: var(--bg); padding-block: 4px 10px; margin-top: -4px; }
.toolbar .chips { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin-inline: -16px; padding-inline: 16px; }
.toolbar .chips::-webkit-scrollbar { display: none; }
.result-line { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); margin-bottom: 8px; }
.result-line b { color: var(--fg); }

/* ---------- catalog */
.cat-layout { display: grid; gap: 24px; }
.cat-side { display: none; }
.cat-main { min-width: 0; }
@media (min-width: 900px) {
  .cat-layout { grid-template-columns: 240px minmax(0, 1fr); align-items: start; }
  .cat-side { display: flex; flex-direction: column; gap: 1px; position: sticky; top: calc(var(--top-h) + 20px); max-height: calc(100vh - var(--top-h) - 40px); overflow-y: auto; padding-right: 6px; scrollbar-width: thin; }
  .cat-side .eyebrow { margin: 4px 10px 10px; }
  .toolbar .chips { flex-wrap: wrap; overflow: visible; margin: 0; padding: 0; }
}
.cat-link { display: flex; justify-content: space-between; align-items: center; gap: 10px; text-align: left; padding: 7px 10px; border-radius: 7px; font-size: 14px; color: var(--fg); }
.cat-link b { font-weight: 500; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.cat-link:hover { background: var(--surface); }
.cat-link.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.cat-link.on b { color: var(--accent); }
.cat-grid { display: grid; grid-template-columns: 1fr; gap: 2px; }

.plist { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.prow { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 10px 12px 10px 10px; border-bottom: 1px solid var(--line-2); }
.prow:last-child { border-bottom: 0; }
.prow.inactive { opacity: .55; }
.prow-main { display: flex; align-items: center; gap: 12px; text-align: left; min-width: 0; }
.prow-info { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.prow-name { font-weight: 600; font-size: 14.5px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.prow-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; color: var(--muted); font-size: 12px; }
.prow-meta code { color: var(--muted); }
.prow-side { display: flex; flex-direction: column; align-items: flex-end; gap: 7px; }
@media (max-width: 559px) {
  .prow { grid-template-columns: 1fr; gap: 8px; }
  .prow-side { flex-direction: row; justify-content: space-between; align-items: center; padding-left: 66px; }
}
@media (min-width: 560px) { .prow-side { flex-direction: row; align-items: center; gap: 14px; } }

.thumb { --h: 160; flex: none; width: 54px; height: 54px; border-radius: 8px; overflow: hidden; display: grid; place-items: center; background: color-mix(in oklab, hsl(var(--h) 45% 50%) 14%, var(--surface-2)); border: 1px solid var(--line-2); }
.thumb img { width: 100%; height: 100%; object-fit: contain; background: #fff; }
.thumb-ph { font: 700 12px/1 var(--f-display); letter-spacing: .04em; text-transform: uppercase; color: color-mix(in oklab, hsl(var(--h) 45% 40%) 75%, var(--fg)); }
.thumb-sm { width: 44px; height: 44px; }
.thumb-lg { width: 100%; max-width: 100%; height: auto; aspect-ratio: 1; }
.thumb-lg .thumb-ph { font-size: 28px; }

.price { display: flex; flex-direction: column; align-items: flex-end; line-height: 1.1; gap: 3px; min-width: 92px; }
.price-list { font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.price-list b { font-weight: 600; color: var(--fg); font-variant-numeric: tabular-nums; }
.price-mine { display: flex; align-items: baseline; gap: 5px; font: 700 22px/1 var(--f-display); color: var(--price); font-variant-numeric: tabular-nums; }
.price-mine small { font: 600 10px/1 var(--f-body); letter-spacing: .07em; text-transform: uppercase; color: var(--price); opacity: .85; }
.price-ask { font-weight: 600; color: var(--price); font-size: 14px; }
.price-save { font: 700 11px/1 var(--f-body); color: var(--ok); background: color-mix(in oklab, var(--ok) 12%, var(--surface)); padding: 3px 5px; border-radius: 4px; font-variant-numeric: tabular-nums; }
@media (max-width: 559px) { .price { align-items: flex-start; } }
.price.big { align-items: flex-start; gap: 6px; }
.price.big .price-mine { font-size: 34px; }
.price.big .price-list { font-size: 14px; }
.price.big .price-save { font-size: 12px; }

.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface); height: 42px; }
.stepper button { width: 38px; height: 100%; display: grid; place-items: center; color: var(--accent); }
.stepper button:hover { background: var(--accent-soft); }
.stepper input { width: 46px; min-height: 0; height: 100%; border: 0; border-inline: 1px solid var(--line-2); border-radius: 0; text-align: center; padding: 0; font-weight: 700; font-variant-numeric: tabular-nums; box-shadow: none; }
.stepper.sm { height: 34px; }
.stepper.sm button { width: 32px; }
.stepper.sm input { width: 38px; font-size: 14px; }
.more { display: flex; justify-content: center; padding: 18px; }

.pdetail { display: grid; gap: 18px; }
@media (min-width: 640px) { .pdetail { grid-template-columns: 240px minmax(0, 1fr); } }
.pdetail-info { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.pdetail h3 { margin: 0; font-size: 19px; line-height: 1.3; }
.qty-line { display: flex; align-items: center; gap: 12px; padding-top: 12px; border-top: 1px solid var(--line-2); }
.qty-line b { margin-left: auto; font: 700 20px/1 var(--f-display); }

/* ---------- sheet */
.sheet-bg { position: fixed; inset: 0; z-index: 50; background: rgb(8 16 13 / .45); display: flex; align-items: flex-end; justify-content: center; animation: fade .15s ease; }
.sheet { width: 100%; max-height: calc(100% - env(safe-area-inset-top, 0px) - 24px); background: var(--surface); border-radius: 16px 16px 0 0; display: flex; flex-direction: column; box-shadow: var(--shadow); animation: up .2s ease; }
.sheet-h { display: flex; align-items: flex-start; gap: 10px; padding: 14px 10px 10px 18px; border-bottom: 1px solid var(--line-2); }
.sheet-title { flex: 1; min-width: 0; }
.sheet-h h2 { margin: 6px 0 0; font: 700 21px/1.15 var(--f-display); }
.sheet-h p { margin: 3px 0 0; font-size: 13px; color: var(--muted); }
.sheet-b { padding: 16px 18px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
.sheet-f { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; padding: 12px 18px calc(12px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line-2); }
.sheet-f .btn { flex: 1 1 auto; }
@media (min-width: 640px) {
  .sheet-bg { align-items: center; padding: 24px; }
  .sheet { max-width: 560px; border-radius: 14px; max-height: calc(100vh - 48px); }
  .sheet.wide { max-width: 860px; }
  .sheet-f .btn { flex: 0 0 auto; }
}
@keyframes fade { from { opacity: 0; } }
@keyframes up { from { transform: translateY(24px); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .sheet, .sheet-bg, .toast { animation: none !important; } }

/* ---------- forms */
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field-l { font-size: 13px; font-weight: 600; color: var(--muted); }
.field-h { font-size: 12px; color: var(--muted); }
.form-col { display: flex; flex-direction: column; gap: 14px; }
.form-grid { display: grid; gap: 18px; }
@media (min-width: 700px) { .form-grid { grid-template-columns: 220px minmax(0, 1fr); } }
.row2, .row3 { display: grid; gap: 12px; }
@media (min-width: 560px) { .row2 { grid-template-columns: 1fr 1fr; } .row3 { grid-template-columns: repeat(3, 1fr); } }
.toggle { display: flex; align-items: center; gap: 14px; padding: 10px 0; cursor: pointer; position: relative; }
.toggle-t { flex: 1; display: flex; flex-direction: column; font-weight: 600; font-size: 14.5px; }
.toggle-t small { font-weight: 400; color: var(--muted); font-size: 13px; }
.toggle input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.toggle-s { width: 44px; height: 26px; border-radius: 13px; background: var(--line); position: relative; flex: none; transition: background .15s; }
.toggle-s::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 2px rgb(0 0 0 / .25); transition: transform .15s; }
.toggle input:checked + .toggle-s { background: var(--accent); }
.toggle input:checked + .toggle-s::after { transform: translateX(18px); }
.toggle input:focus-visible + .toggle-s { outline: 2px solid var(--accent); outline-offset: 2px; }
.input-btn { display: flex; gap: 6px; }
.color-in { display: flex; align-items: center; gap: 10px; }
.color-in input { width: 48px; height: 42px; padding: 3px; }
.logo-in { display: flex; align-items: center; gap: 12px; }
.logo-in img, .logo-ph { width: 48px; height: 48px; border-radius: 10px; object-fit: cover; }
.logo-ph { display: grid; place-items: center; background: var(--accent); color: var(--accent-ink); font: 700 26px/1 var(--f-display); }
.img-edit { display: flex; flex-direction: column; gap: 10px; }
.img-btns { display: flex; gap: 8px; flex-wrap: wrap; }
.num-in { width: 90px; text-align: right; min-height: 36px; padding: 6px 8px; font-variant-numeric: tabular-nums; }
.mini-check { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; }
.mini-check input { width: auto; min-height: 0; }

/* ---------- empty */
.empty { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; padding: 48px 16px; color: var(--muted); }
.empty strong { color: var(--fg); font-size: 16px; }
.empty-b { display: flex; flex-direction: column; align-items: center; gap: 14px; max-width: 42ch; }
.empty-b p { margin: 0; }

/* ---------- cart */
.cart-head { display: flex; justify-content: space-between; align-items: center; }
.cart-grid { display: grid; gap: 16px; align-items: start; }
@media (min-width: 900px) { .cart-grid { grid-template-columns: minmax(0, 1fr) 360px; } .cart-sum { position: sticky; top: calc(var(--top-h) + 20px); } }
.clist { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.cline { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px 12px; padding: 12px; border-bottom: 1px solid var(--line-2); align-items: center; }
.cline:last-child { border-bottom: 0; }
.cline-info { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.cline-ctl { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; }
.cline-sum { margin-left: auto; display: flex; flex-direction: column; align-items: flex-end; font-size: 13px; }
.cline-sum b { font: 700 18px/1.1 var(--f-display); }
@media (min-width: 640px) { .cline { grid-template-columns: auto minmax(0, 1fr) auto; } .cline-ctl { grid-column: auto; } .cline-sum { min-width: 110px; } }
.cart-sum { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.sum-rows { display: flex; flex-direction: column; gap: 6px; }
.sum-rows > div { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; color: var(--muted); }
.sum-total { color: var(--fg) !important; padding-top: 8px; border-top: 1px solid var(--line-2); align-items: baseline; }
.sum-total span { font-weight: 600; }
.sum-total b { font: 700 28px/1 var(--f-display); color: var(--price); }
.sum-save { color: var(--ok) !important; font-weight: 600; }
.cart-actions { display: flex; flex-direction: column; gap: 10px; }

/* ---------- requests */
.req-page { display: grid; gap: 16px; }
.req-list { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.req-list-h { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.req-detail { min-width: 0; display: none; }
.req-page.has-detail .req-list { display: none; }
.req-page.has-detail .req-detail { display: block; }
@media (min-width: 900px) {
  .req-page { grid-template-columns: 370px minmax(0, 1fr); align-items: start; }
  .req-page .req-list, .req-page.has-detail .req-list { display: flex; position: sticky; top: calc(var(--top-h) + 20px); max-height: calc(100vh - var(--top-h) - 40px); }
  .req-page .req-detail { display: block; }
  .rlist { overflow-y: auto; }
  .req-list .chips.scroll { flex-wrap: wrap; margin: 0; padding: 0; overflow: visible; }
}
.req-placeholder { background: var(--surface); border: 1px dashed var(--line); border-radius: var(--r); }
.rlist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.rcard { width: 100%; display: flex; gap: 12px; align-items: flex-start; text-align: left; padding: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); position: relative; }
.rcard:hover { border-color: color-mix(in oklab, var(--accent) 40%, var(--line)); }
.rcard.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.rcard.unread { background: color-mix(in oklab, var(--info) 5%, var(--surface)); }
.rcard.unread strong { font-weight: 700; }
.rcard-b { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px; }
.rcard-top { display: flex; justify-content: space-between; gap: 8px; font-size: 14.5px; }
.rcard-top strong { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
.rcard-top .muted { font-size: 12px; flex: none; }
.rcard-mid { display: flex; align-items: center; gap: 8px; font-size: 13px; flex-wrap: wrap; }
.rcard-mid b { color: var(--fg); }
.rcard-last { margin: 0; font-size: 13.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rcard .badge { position: absolute; right: 10px; bottom: 12px; }

.avatar { --h: 160; display: inline-grid; place-items: center; border-radius: 50%; overflow: hidden; flex: none; background: color-mix(in oklab, hsl(var(--h) 50% 45%) 22%, var(--surface-2)); color: color-mix(in oklab, hsl(var(--h) 55% 32%) 80%, var(--fg)); font-family: var(--f-display); font-weight: 700; }
.avatar img { width: 100%; height: 100%; object-fit: cover; }

.rd { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); display: flex; flex-direction: column; min-width: 0; }
.rd-h { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--line-2); }
.rd-title { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.rd-title h2 { margin: 0; font: 700 21px/1.15 var(--f-display); }
.rd-title .muted { font-size: 13px; }
.cust-strip { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid var(--line-2); text-align: left; flex-wrap: wrap; }
.cust-strip:hover { background: var(--surface-2); }
.cust-strip-b { display: flex; flex-direction: column; flex: 1; min-width: 160px; font-size: 14px; }
.cust-stats { display: flex; gap: 14px; font-size: 13px; color: var(--muted); }
.cust-stats b { color: var(--fg); font-variant-numeric: tabular-nums; }
.cust-stats .warn, .cust-stats .warn b { color: var(--bad); }
.banner { display: flex; gap: 12px; align-items: flex-start; margin: 12px 14px 0; padding: 12px 14px; border-radius: var(--r-sm); font-size: 14px; }
.banner.ok { background: color-mix(in oklab, var(--ok) 11%, var(--surface)); color: color-mix(in oklab, var(--ok) 70%, var(--fg)); }
.banner.warn { background: color-mix(in oklab, var(--warn) 12%, var(--surface)); color: color-mix(in oklab, var(--warn) 65%, var(--fg)); }
.rd-items { padding: 6px 14px 12px; overflow-x: auto; }
.itable { width: 100%; border-collapse: collapse; font-size: 14px; }
.itable th { text-align: left; font: 600 11px/1 var(--f-body); letter-spacing: .07em; text-transform: uppercase; color: var(--muted); padding: 12px 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.itable td { padding: 10px 6px; border-bottom: 1px solid var(--line-2); vertical-align: middle; }
.itable .r { text-align: right; }
.itable tr.changed td { background: var(--price-soft); }
.it-name { min-width: 150px; }
.it-name span { display: block; font-weight: 600; line-height: 1.3; }
.it-name code { color: var(--muted); }
.hl { color: var(--price); }
.adj { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: var(--r-sm); overflow: hidden; background: var(--surface); }
.adj button { height: 34px; padding: 0 9px; font-weight: 700; font-size: 13px; color: var(--price); background: var(--price-soft); font-variant-numeric: tabular-nums; }
.adj button:hover { filter: brightness(.96); }
.adj input { width: 66px; min-height: 0; height: 34px; border: 0; border-radius: 0; text-align: center; padding: 0 4px; font-weight: 700; font-variant-numeric: tabular-nums; box-shadow: none; }
.rd-totals { display: flex; justify-content: flex-end; align-items: baseline; gap: 6px 18px; flex-wrap: wrap; padding-top: 12px; font-size: 14px; }
.rd-total { font-weight: 600; }
.rd-total b { font: 700 26px/1 var(--f-display); color: var(--price); margin-left: 6px; }
.rd-actions { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 14px 14px; align-items: center; }
.rd-actions:empty { display: none; }
.dirty-note { font-size: 13px; color: var(--warn); flex-basis: 100%; }
.chat { display: flex; flex-direction: column; gap: 8px; padding: 14px; background: var(--surface-2); border-top: 1px solid var(--line-2); min-height: 140px; }
.msg { max-width: min(78%, 520px); display: flex; flex-direction: column; gap: 3px; }
.msg p { margin: 0; padding: 9px 12px; border-radius: 14px; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 14.5px; }
.msg time { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.msg.me { align-self: flex-end; align-items: flex-end; }
.msg.me p { background: var(--accent); color: var(--accent-ink); border-bottom-right-radius: 4px; }
.msg.them { align-self: flex-start; }
.msg.them p { background: var(--surface); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
.msg.sys { align-self: center; align-items: center; text-align: center; max-width: 92%; }
.msg.sys span { font-size: 12.5px; color: var(--muted); background: var(--surface); border: 1px solid var(--line-2); padding: 5px 10px; border-radius: 12px; }
.composer { border-top: 1px solid var(--line-2); padding: 10px 14px 14px; display: flex; flex-direction: column; gap: 10px; position: sticky; bottom: calc(var(--bot-h) + env(safe-area-inset-bottom, 0px)); background: var(--surface); border-radius: 0 0 var(--r) var(--r); }
@media (min-width: 900px) { .composer { bottom: 0; } }
.composer-row { display: flex; gap: 8px; align-items: flex-end; }
.composer-row textarea { min-height: 44px; max-height: 140px; }
.chips.quick { margin-inline: -14px; padding-inline: 14px; }
.chips.quick .chip { height: 30px; font-size: 13px; }

/* ---------- customers */
.ulist { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
@media (min-width: 900px) { .ulist { grid-template-columns: 1fr 1fr; } }
.ucard { width: 100%; height: 100%; display: flex; gap: 12px; align-items: center; text-align: left; padding: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.ucard:hover { border-color: color-mix(in oklab, var(--accent) 40%, var(--line)); }
.ucard.inactive { opacity: .6; }
.ucard-b { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; font-size: 14px; }
.ucard-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 3px; }
.ucard-n { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; font-size: 12px; }
.cust-head { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.cust-kpis { display: flex; gap: 8px; flex: 1; flex-wrap: wrap; }
.cust-kpis > div { flex: 1 1 90px; background: var(--surface-2); border: 1px solid var(--line-2); border-radius: var(--r-sm); padding: 10px 12px; display: flex; flex-direction: column; }
.cust-kpis b { font: 700 24px/1 var(--f-display); }
.cust-kpis span { font-size: 12px; color: var(--muted); }
.cust-kpis .warn b { color: var(--bad); }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tab { padding: 10px 12px; font-weight: 600; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tab.on { color: var(--accent); border-color: var(--accent); }
.mini-list { list-style: none; margin: -6px 0 0; padding: 4px; border: 1px solid var(--line); border-radius: var(--r-sm); }
.mini-list button { width: 100%; display: flex; gap: 10px; align-items: center; padding: 8px; text-align: left; border-radius: 6px; font-size: 14px; }
.mini-list button span { flex: 1; min-width: 0; }
.mini-list button:hover { background: var(--accent-soft); }
.hist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.hist button { width: 100%; display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding: 11px 4px; border-bottom: 1px solid var(--line-2); text-align: left; font-size: 14px; }
.hist-r { display: flex; gap: 10px; align-items: center; }
.share-box { background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 12px; font: 13px/1.6 var(--f-mono); white-space: pre-wrap; margin: 0; user-select: all; }

/* ---------- settings / profile */
.set-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.set-card h2 { margin: 0; font: 700 21px/1.1 var(--f-display); }
.set-card h3 { margin: 8px 0 -6px; font-size: 14px; }
.sec-nav { position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--top-h)); z-index: 5; background: var(--bg); padding-block: 6px; }
.settings .set-card { max-width: 860px; }
.preview-box { display: flex; flex-direction: column; gap: 4px; padding: 12px; border-radius: var(--r-sm); background: var(--price-soft); font-size: 14px; }
.preview-box b { color: var(--price); }
.tier-list { display: flex; flex-direction: column; gap: 8px; }
.tier-row { display: grid; grid-template-columns: minmax(0, 1fr) 110px auto; gap: 8px; align-items: center; }
.pct-in { display: flex; align-items: center; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface); padding-left: 10px; }
.pct-in span { color: var(--muted); font-weight: 600; }
.pct-in input { border: 0; box-shadow: none; text-align: right; }
.cat-edit { display: flex; flex-direction: column; gap: 6px; }
.cat-row { display: grid; grid-template-columns: 48px minmax(0, 1fr) 64px 40px auto; gap: 8px; align-items: center; }
.cat-row code { color: var(--muted); }
.cat-row input { min-height: 36px; padding: 6px 10px; }
.cat-row .ord { text-align: center; padding: 6px; }
@media (max-width: 559px) { .cat-row { grid-template-columns: 40px minmax(0, 1fr) 52px auto; } .cat-row > .muted { display: none; } }
.data-box { display: flex; gap: 14px; align-items: center; justify-content: space-between; padding: 14px 0; border-bottom: 1px solid var(--line-2); flex-wrap: wrap; }
.data-box:last-child { border-bottom: 0; }
.data-box > div { flex: 1 1 260px; display: flex; flex-direction: column; gap: 4px; }



.profile-card { display: flex; align-items: center; gap: 18px; padding: 6px 0; }
.profile-card p { margin: 4px 0 8px; }
.avatar-edit { position: relative; }
.avatar-btn { position: absolute; right: -2px; bottom: -2px; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: var(--accent-ink); border: 3px solid var(--bg); cursor: pointer; }
.shop-card p { margin: 0; display: flex; gap: 10px; align-items: center; }
.shop-card a { color: var(--accent); font-weight: 600; }

/* ---------- login / splash */
.login { min-height: 100%; display: grid; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 24px; place-items: center; }
.login-art { display: none; }
.login-card { width: 100%; max-width: 400px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 26px 22px; display: flex; flex-direction: column; gap: 14px; box-shadow: var(--shadow); }
.login-card h1 { margin: 10px 0 0; font: 700 28px/1.1 var(--f-display); }
.demo-hint { display: flex; flex-direction: column; gap: 8px; padding: 12px; border: 1px dashed var(--line); border-radius: var(--r-sm); }
.demo-btns { display: flex; gap: 8px; flex-wrap: wrap; }
@media (min-width: 900px) {
  .login { grid-template-columns: minmax(0, 1fr) 420px; gap: 64px; max-width: 1100px; margin: 0 auto; }
  .login-art { display: flex; flex-direction: column; gap: 28px; }
  .tagline-big { font: 700 64px/.95 var(--f-display); text-transform: uppercase; letter-spacing: -.005em; color: var(--fg); }
  .login-points { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; color: var(--muted); font-size: 16px; }
  .login-points li { display: flex; gap: 10px; align-items: center; }
  .login-points .ic { color: var(--accent); }
}
.splash { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding: 24px; text-align: center; }
.spinner { width: 28px; height: 28px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--accent); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(1turn); } }
.toast { position: fixed; z-index: 70; left: 50%; transform: translateX(-50%); top: calc(env(safe-area-inset-top, 0px) + var(--top-h) + 10px); background: var(--fg); color: var(--bg); padding: 11px 16px; border-radius: 10px; font-size: 14px; font-weight: 600; box-shadow: var(--shadow); animation: up .2s ease; max-width: calc(100% - 32px); }
.toast.tone-bad { background: var(--bad); color: #fff; }


/* talep kalemleri: telefonda kart düzeni */
@media (max-width: 639px) {
  .rd-items { overflow: visible; }
  .itable thead { display: none; }
  .itable tbody, .itable tr { display: block; }
  .itable tr { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)) auto; gap: 8px 10px; padding: 12px 0; border-bottom: 1px solid var(--line-2); align-items: end; }
  .itable tr.changed { background: var(--price-soft); margin-inline: -14px; padding-inline: 14px; }
  .itable tr.changed td { background: none; }
  .itable td { padding: 0; border: 0; text-align: left !important; }
  .itable td[data-l]::before { content: attr(data-l); display: block; font: 600 10px/1 var(--f-body); letter-spacing: .07em; text-transform: uppercase; color: var(--muted); margin-bottom: 5px; }
  .itable .it-name { grid-column: 1 / -1; min-width: 0; }
  .itable .it-list { display: none; }
  .itable .it-del { grid-column: 4; grid-row: 1; }
  .itable tr:has(.it-del) .it-name { grid-column: 1 / 4; }
  .itable .it-offer { grid-column: 1 / -1; }
  .itable .it-sum { grid-column: 3 / 5; grid-row: 2; text-align: right !important; }
  .itable .it-sum b { font: 700 18px/1 var(--f-display); }
  .itable tr:has(.adj) .it-sum { grid-row: 2; }
  .adj { width: 100%; }
  .adj button { flex: 1; height: 40px; font-size: 15px; }
  .adj input { flex: 1.4; height: 40px; font-size: 17px; }
  .rd-totals { justify-content: space-between; }
}
.img-edit .thumb-lg { max-width: 200px; }
.pdetail .thumb-lg { max-width: 280px; }
@media (min-width: 640px) { .pdetail .thumb-lg { max-width: 100%; } }

.steps { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
kbd { font: 600 12px var(--f-mono); padding: 1px 5px; border: 1px solid var(--line); border-radius: 4px; background: var(--surface-2); }
.code-row { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
.share-box.code { max-height: 110px; overflow: auto; width: 100%; font-size: 11px; word-break: break-all; user-select: text; }

/* ---------- kategori ağacı */
.cat-node { display: flex; flex-direction: column; gap: 1px; }
.cat-link.sub { padding-left: calc(10px + var(--d, 1) * 14px); font-size: 13.5px; }
.cat-link.sub span { color: var(--muted); }
.cat-link.sub.on span { color: var(--accent); }
.cat-caret { font-style: normal; color: var(--muted); margin-left: 6px; font-size: 11px; }
.cat-row { padding-left: calc(var(--d, 0) * 18px); }
.cat-row:has(+ .cat-row) { }
.brand-tag { font-weight: 600; color: var(--fg); opacity: .75; }

/* ---------- galeri */
.gallery { position: relative; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.gal-track { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; border-radius: 10px; border: 1px solid var(--line-2); background: #fff; aspect-ratio: 1; }
.gal-track::-webkit-scrollbar { display: none; }
.gal-slide { flex: 0 0 100%; scroll-snap-align: start; display: grid; place-items: center; }
.gal-slide img { width: 100%; height: 100%; object-fit: contain; }
.gal-slide .thumb-lg { border: 0; border-radius: 0; }

.gal-stage { position: relative; }
.strip { position: relative; display: flex; align-items: center; min-width: 0; }
.gal-thumbs { display: flex; gap: 6px; overflow-x: auto; scroll-behavior: smooth; scrollbar-width: thin; scrollbar-color: var(--line) transparent; padding-bottom: 4px; min-width: 0; flex: 1; }

.strip-arrow { position: absolute; top: calc(50% - 2px); transform: translateY(-50%); z-index: 2; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); color: var(--fg); border: 1px solid var(--line); box-shadow: 0 2px 6px rgb(0 0 0 / .18); }

@media (min-width: 640px) { .pdetail { grid-template-columns: 300px minmax(0, 1fr); } }

/* ---------- açıklama */

.pdesc:not(.open) .pdesc-body::after { content: ""; position: absolute; inset: auto 0 0; height: 70px; background: linear-gradient(transparent, var(--surface)); }
.pdesc.open .pdesc-body, .pdesc-body.open { max-height: none; }
.pdesc-body img { max-width: 100%; height: auto; border-radius: 6px; display: block; margin: 8px 0; }

.pdesc .link { align-self: flex-start; }

/* ---------- ürün düzenleme ekleri */
.pe-sec { display: flex; flex-direction: column; gap: 10px; border-top: 1px solid var(--line-2); padding-top: 14px; }

.img-strip { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
.img-cell { position: relative; flex: none; width: 96px; height: 96px; border-radius: 8px; overflow: hidden; border: 1px solid var(--line); background: #fff; }
.img-cell.main { border: 2px solid var(--accent); }
.img-cell img { width: 100%; height: 100%; object-fit: contain; }
.img-cell-tools { position: absolute; inset: auto 0 0; display: flex; justify-content: space-between; gap: 2px; padding: 3px; background: rgb(0 0 0 / .55); }

.img-cell-tools button:last-child { margin-left: auto; }
.img-main-badge { position: absolute; top: 4px; left: 4px; background: var(--accent); color: var(--accent-ink); font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 4px; }
.mono-in { font: 12.5px/1.5 var(--f-mono); }
.tag-in { display: flex; flex-wrap: wrap; gap: 6px; padding: 6px; min-height: 42px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface); cursor: text; }
.tag-in:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in oklab, var(--accent) 22%, transparent); }
.tag-chip { display: inline-flex; align-items: center; gap: 4px; height: 28px; padding: 0 4px 0 10px; border-radius: 14px; background: var(--surface-2); border: 1px solid var(--line-2); font-size: 13px; }
.tag-chip button { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); }
.tag-chip button:hover { background: var(--line); color: var(--fg); }
.tag-in input { flex: 1; min-width: 120px; border: 0; box-shadow: none; min-height: 28px; padding: 0 4px; }
.tag-in input:focus { box-shadow: none; }

/* ---------- logo */
.brand-logo { width: 38px !important; height: 38px !important; border-radius: 50% !important; background: #fff; object-fit: contain !important; padding: 1px; box-shadow: 0 0 0 1px var(--line-2); }
.login-logo { width: min(260px, 80%); height: auto; align-self: center; margin: 2px 0 4px; }
:root[data-theme="dark"] .login-logo { background: #fff; border-radius: 12px; padding: 8px 12px; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .login-logo { background: #fff; border-radius: 12px; padding: 8px 12px; } }
.logo-in img { background: #fff; border-radius: 50%; object-fit: contain; }

/* ---------- büyütme */
.gal-open, .gal-single { display: block; width: 100%; height: 100%; padding: 0; cursor: zoom-in; position: relative; }
.gal-single:disabled { cursor: default; opacity: 1; }
.gal-open img { width: 100%; height: 100%; object-fit: contain; }
.gal-zoom { position: absolute; right: 8px; bottom: 8px; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: rgb(0 0 0 / .55); color: #fff; }
.gal-count { display: inline-flex; align-items: center; gap: 4px; }
.pdesc-body img { cursor: zoom-in; }
.lb { --lb-top: calc(env(safe-area-inset-top, 0px) + 60px); --lb-bot: calc(env(safe-area-inset-bottom, 0px) + 20px); position: fixed; inset: 0; z-index: 90; background: rgb(8 10 16 / .94); color: #fff; animation: fade .15s ease; }
.lb.many { --lb-bot: calc(env(safe-area-inset-bottom, 0px) + 92px); }
.lb-track { position: absolute; inset: 0; display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; }
.lb-track::-webkit-scrollbar { display: none; }
.lb-track.locked { overflow-x: hidden; }
.lb-slide { position: relative; flex: 0 0 100%; height: 100%; scroll-snap-align: start; overflow: hidden; }
/* resim kendi boyutundan büyütülmez, ekrana sığacak kadar küçülür */
.lb-slide img { position: absolute; top: var(--lb-top); bottom: var(--lb-bot); left: 16px; right: 16px; margin: auto; max-width: calc(100% - 32px); max-height: calc(100% - var(--lb-top) - var(--lb-bot)); width: auto; height: auto; object-fit: contain; user-select: none; background: #fff; border-radius: 6px; cursor: zoom-in; }
@media (min-width: 900px) { .lb-slide img { left: 80px; right: 80px; max-width: min(calc(100% - 160px), 1100px); } }
.lb-slide.zoomed { overflow: auto; }
.lb-slide.zoomed img { position: static; margin: 0; max-width: none; max-height: none; width: var(--zw, 200%); border-radius: 0; cursor: zoom-out; }
.lb-top { position: absolute; top: 0; left: 0; right: 0; z-index: 3; display: flex; align-items: center; gap: 10px; padding: calc(env(safe-area-inset-top, 0px) + 8px) max(12px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)); background: rgb(8 10 16 / .7); font-weight: 600; }
.lb-title { flex: 1; min-width: 0; font-size: 14px; font-weight: 500; opacity: .85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lb-btn { flex: none; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; color: #fff; background: rgb(255 255 255 / .12); }
.lb-btn:hover, .lb-btn.on { background: rgb(255 255 255 / .26); }
.lb-nav { position: absolute; top: 50%; transform: translateY(-50%); z-index: 3; }
.lb-nav.prev { left: max(16px, env(safe-area-inset-left, 0px)); }
.lb-nav.next { right: max(16px, env(safe-area-inset-right, 0px)); }
.lb-nav.next .ic { transform: scaleX(-1); }
@media (hover: none) { .lb-nav { display: none; } }
.lb-strip { position: absolute; left: 0; right: 0; bottom: 0; z-index: 3; display: flex; justify-content: center; padding: 10px 16px calc(env(safe-area-inset-bottom, 0px) + 10px); background: rgb(8 10 16 / .7); }
.lb-strip .strip { max-width: min(100%, 720px); }

/* ---------- açıklama düzenleyici */

.rte-body { min-height: 160px; max-height: 420px; overflow-y: auto; padding: 12px 14px; outline: none; }

/* ---------- üyelik başvuruları */
.pending { border: 1px solid color-mix(in oklab, var(--warn) 40%, var(--line)); background: color-mix(in oklab, var(--warn) 6%, var(--surface)); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.pending-h { margin: 0; font-size: 15px; display: flex; align-items: center; gap: 8px; }

.pending-row select { width: auto; min-height: 36px; padding: 4px 8px; }

/* ---------- şifre & telefon */
.pw-in { position: relative; display: flex; }
.pw-in input { padding-right: 46px; }
.pw-eye { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); width: 38px; height: 34px; border-radius: 6px; display: grid; place-items: center; color: var(--muted); touch-action: none; user-select: none; -webkit-user-select: none; }

/* ---------- yönetim paneli görünümü */
.admin-badge { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 13px; font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; white-space: nowrap; }
.shell.admin { --admin-bar: #16213f; --admin-ink: #e9eefb; --admin-dim: #a9b6d6; }
.shell.admin .topbar { background: var(--admin-bar); border-bottom-color: #0d1530; color: var(--admin-ink); }

body:has(.shell.admin)::before { background: #16213f; }
.login-card.admin { border-top: 4px solid #f5b20b; }
.admin-flag { align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 13px; background: #16213f; color: #fff; font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }

/* ---------- sağ tık menüsü */
.ctx { position: fixed; z-index: 95; min-width: 220px; max-width: 300px; padding: 6px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); box-shadow: 0 10px 34px rgb(10 20 40 / .22), 0 2px 6px rgb(10 20 40 / .12); animation: fade .08s ease; }
.ctx-title { padding: 6px 10px 8px; font-size: 12px; font-weight: 600; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-bottom: 1px solid var(--line-2); margin-bottom: 4px; }
.ctx-item { width: 100%; display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 6px; font-size: 14px; text-align: left; color: var(--fg); }

/* ---------- marka, vitrin, whatsapp */
.brand-btn { padding: 2px 6px 2px 2px; border-radius: 22px; }
.brand-btn:hover { background: var(--surface-2); }
.shell.admin .brand-btn:hover { background: rgb(255 255 255 / .08); }
.pub-badge { display: inline-flex; align-items: center; height: 24px; padding: 0 10px; border-radius: 12px; background: var(--accent-soft); color: var(--accent); font-size: 12px; font-weight: 700; white-space: nowrap; }

.btn.wa { background: #1fa855; color: #fff; }

.paper-h { display: flex; align-items: center; gap: 14px; padding: 18px 20px 10px; }

.paper-f { padding: 14px 20px 18px; display: flex; flex-direction: column; gap: 6px; }

.export-bar { display: flex; flex-wrap: wrap; gap: 8px; }
.img-prev { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface-2); padding: 10px; display: flex; flex-direction: column; gap: 10px; }

.admin-hint { margin-top: 6px; opacity: .8; }

/* ---------- pencerelerde yatay kayma olmasın: içerik pencereye sığar, sadece aşağı-yukarı kayar */

/* ---------- giriş sayfası (/) */
.landing { min-height: 100%; display: flex; flex-direction: column; align-items: center; gap: 28px; padding: calc(env(safe-area-inset-top, 0px) + 40px) 16px calc(env(safe-area-inset-bottom, 0px) + 28px); background: radial-gradient(1200px 500px at 50% -10%, color-mix(in oklab, var(--accent) 16%, transparent), transparent), var(--bg); }

.door { display: flex; flex-direction: column; gap: 14px; padding: 26px; border-radius: 18px; text-decoration: none; color: var(--fg); background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); transition: transform .15s, box-shadow .15s; min-height: 220px; }
.door:hover { transform: translateY(-2px); }

/* ===== animasyonlar: hafif, sadece transform / opacity (telefonda akıcı) ===== */
:root { --ease: cubic-bezier(.2, .7, .2, 1); --spring: cubic-bezier(.34, 1.56, .64, 1); }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } }
@keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.18); } 100% { transform: scale(1); } }
@keyframes slideUp { from { opacity: 0; transform: translate(-50%, 24px); } }
@keyframes shine { from { background-position: -200% 0; } to { background-position: 200% 0; } }
/* sayfa / sekme geçişi */
.main > * { animation: rise .32s var(--ease) backwards; }
.plist > li { animation: rise .35s var(--ease) backwards; }
.plist > li:nth-child(2) { animation-delay: .02s; } .plist > li:nth-child(3) { animation-delay: .04s; } .plist > li:nth-child(4) { animation-delay: .06s; }
.plist > li:nth-child(5) { animation-delay: .08s; } .plist > li:nth-child(6) { animation-delay: .1s; } .plist > li:nth-child(n+7) { animation-delay: .12s; }
.olist > li, .co-sec, .o-card, .set-card, .done-card, .cart-sum, .gline { animation: rise .3s var(--ease) backwards; }
.co-sec:nth-child(2) { animation-delay: .04s; } .co-sec:nth-child(3) { animation-delay: .08s; } .co-sec:nth-child(4) { animation-delay: .12s; } .co-sec:nth-child(5) { animation-delay: .16s; }
/* ürün satırı: üzerine gelince tıklanabilir olduğu belli olsun */
.prow { position: relative; transition: background .18s var(--ease), box-shadow .18s var(--ease); }
.prow::before { content: ""; position: absolute; left: 0; top: 8px; bottom: 8px; width: 3px; border-radius: 0 3px 3px 0; background: var(--accent); transform: scaleY(0); transition: transform .2s var(--ease); }
.prow-main { cursor: pointer; }
.prow .thumb { transition: transform .25s var(--ease), box-shadow .25s var(--ease); }
.prow-name { transition: color .15s; }
@media (hover: hover) {
  .prow:hover { background: color-mix(in oklab, var(--accent) 4%, var(--surface)); }
  .prow:hover::before { transform: scaleY(1); }
  .prow:hover .thumb { transform: scale(1.06); box-shadow: 0 4px 14px -6px rgb(0 0 0 / .35); }
  .prow:hover .prow-name { color: var(--accent); }
  .ocard, .seg-card, .addr-card:not(.static), .tile, .door, .rcard, .cat-link { transition: transform .18s var(--ease), box-shadow .18s var(--ease), border-color .15s, background .15s; }
  .ocard:hover, .tile:hover, .rcard:hover { transform: translateY(-2px); box-shadow: 0 8px 20px -12px rgb(10 20 40 / .35); }
  .seg-card:hover, .addr-card:not(.static):hover { transform: translateY(-1px); }
  .door:hover { transform: translateY(-3px); box-shadow: 0 16px 34px -18px rgb(10 20 40 / .45); }
  .gline:hover { background: var(--surface-2); }
  .gline-p .thumb { transition: transform .2s var(--ease); } .gline-p:hover .thumb { transform: scale(1.06); }
  .btn.primary:hover:not(:disabled), .btn.wa:hover:not(:disabled) { box-shadow: 0 6px 16px -8px color-mix(in oklab, var(--accent) 80%, black); }
  .gbar:hover { transform: translateX(-50%) translateY(-2px); }
  .topnav-b:hover .ic, .botnav-b:hover .ic { transform: translateY(-1px); }
}
/* basınca hafif çökme */
.btn, .icon-btn, .chip, .topnav-b, .botnav-b, .ocard, .seg-card, .addr-card, .tile, .gbar, .stepper button { transition: transform .12s var(--ease), background .15s, border-color .15s, box-shadow .18s, color .15s; }
.btn:active:not(:disabled), .icon-btn:active, .chip:active, .ocard:active, .seg-card:active, .addr-card:not(.static):active, .tile:active, .stepper button:active { transform: scale(.96); }
.gbar:active { transform: translateX(-50%) scale(.98); }
.botnav-b .ic, .topnav-b .ic { transition: transform .2s var(--spring); }
.botnav-b.on .ic { transform: translateY(-1px) scale(1.08); }
/* sepete ekleme: düğme ve sepet rozeti zıplar */
.btn.add { transition: transform .12s var(--ease), background .15s, color .15s; }
.btn.add:hover .ic { transform: rotate(90deg); }
.btn.add .ic { transition: transform .25s var(--spring); }
.prow-side .stepper { animation: rise .22s var(--spring) backwards; }
.badge { animation: pop .35s var(--spring); }
.gbar { animation: slideUp .35s var(--spring) backwards; transition: transform .2s var(--ease), box-shadow .2s; }
.gbar-n b { animation: pop .35s var(--spring); }
/* seçim kartları: radyo noktası yumuşak */
.radio { transition: border-width .18s var(--spring), border-color .15s; }
/* takip çubuğu dolar gibi */
.track li::before { transform-origin: left; transition: background .3s; }
.track li.on .track-dot { animation: pop .5s var(--spring); }
/* resim yüklenirken parıltı */
.thumb img { animation: fade .3s ease backwards; }
.toast { animation: rise .25s var(--spring); }
.sheet { animation: up .28s var(--spring); }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-delay: 0s !important; transition-duration: .001ms !important; }
}

/* animasyon bitince hiçbir dönüşüm kalmasın: açılan pencereler (ürün detayı vb.) her zaman ekrana göre konumlanır */
.prow-main:focus-visible { outline-offset: -2px; border-radius: 8px; }
/* "Çok yakında" (kolay kaldırılır: Ayarlar > Online mağaza) */
.soon-tag { display: inline-flex; align-items: center; height: 22px; padding: 0 9px; border-radius: 11px; background: color-mix(in oklab, #f5b20b 22%, var(--surface)); color: #8a5a00; font: 700 11px/1 var(--f-body); letter-spacing: .05em; text-transform: uppercase; white-space: nowrap; }
[data-theme="dark"] .soon-tag { color: #f5c24a; }
.soon-btn { position: relative; cursor: not-allowed; opacity: .55; filter: saturate(.6); pointer-events: none; }
.soon-btn .soon-tag { position: absolute; top: -10px; right: 10px; background: #fff; border: 1px solid var(--line); }
.soon-btn { overflow: visible; }
.soon-card { align-items: center; text-align: center; padding: 34px 22px; }
.soon-card p { margin: 0; max-width: 52ch; }
.soon-ic { width: 66px; height: 66px; border-radius: 50%; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
.soon-admin { display: flex; flex-direction: column; gap: 10px; padding: 12px; border-radius: 12px; background: color-mix(in oklab, #f5b20b 9%, var(--surface)); border: 1px dashed color-mix(in oklab, #f5b20b 45%, var(--line)); }

/* =====================================================================================
   ONLINE MAĞAZA ANA SAYFASI — vitrin: reklam alanı, marka kutuları, bento kutular, ürün rafları
   ===================================================================================== */
.sh { --gap: 16px; display: flex; flex-direction: column; gap: 40px; padding-bottom: 90px; }
.sh-sec { display: flex; flex-direction: column; gap: 18px; }
.sh-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.sh-head h2 { margin: 0; font: 800 clamp(26px, 3.2vw, 38px)/1 var(--f-display); letter-spacing: .01em; display: flex; align-items: center; gap: 12px; }
.sh-head h2::before { content: ""; width: 10px; height: 26px; border-radius: 3px; background: linear-gradient(180deg, var(--accent), var(--price)); }
.sh-head p { margin: 6px 0 0 22px; color: var(--muted); font-size: 14px; }
.sh-more { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; color: var(--accent); white-space: nowrap; padding: 6px 2px; }
.sh-more .ic { transition: transform .2s var(--ease); }
.sh-more:hover .ic { transform: translateX(4px); }
.sh-tag { display: inline-flex; align-items: center; gap: 7px; align-self: flex-start; height: 26px; padding: 0 11px; border-radius: 13px; font: 700 12px/1 var(--f-body); letter-spacing: .08em; background: rgb(255 255 255 / .14); color: #fff; backdrop-filter: blur(6px); border: 1px solid rgb(255 255 255 / .22); }
.sh-tag.glow::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #34ff9a; box-shadow: 0 0 0 4px rgb(52 255 154 / .2), 0 0 12px #34ff9a; animation: blink 1.6s ease-in-out infinite; }
@keyframes blink { 50% { opacity: .35; } }

/* ---- büyük reklam alanı */

.sh-slide-t { position: relative; display: flex; flex-direction: column; gap: 16px; max-width: 620px; }

.sh-slide-t p { margin: 0; font-size: clamp(15px, 1.4vw, 18px); line-height: 1.5; opacity: .82; max-width: 46ch; }
.sh-cta-btn { align-self: flex-start; margin-top: 6px; display: inline-flex; align-items: center; gap: 14px; height: 54px; padding: 0 8px 0 24px; border-radius: 27px; background: #fff; color: #0b1430; font: 700 16px/1 var(--f-body); box-shadow: 0 10px 30px -10px color-mix(in oklab, var(--g1) 80%, transparent); transition: transform .2s var(--ease), box-shadow .2s; }

.sh-float { position: relative; max-width: 92%; max-height: 380px; object-fit: contain; filter: drop-shadow(0 30px 40px rgb(0 0 0 / .5)); animation: float 6s ease-in-out infinite; }
@keyframes float { 50% { transform: translateY(-14px) rotate(-1.5deg); } }

.sh-slide.cover { grid-template-columns: 1fr; align-items: end; background: #000; }

.sh-slide.cover::after { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(0deg, rgb(0 0 0 / .65), transparent 60%); }
.sh-slide.on .sh-slide-t > * { animation: rise .7s var(--ease) backwards; }

.sh-dots { position: absolute; left: clamp(28px, 5vw, 64px); bottom: 22px; display: flex; gap: 8px; }

.sh-hero-nav { position: absolute; top: 50%; translate: 0 -50%; width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; color: #fff; background: rgb(255 255 255 / .1); border: 1px solid rgb(255 255 255 / .2); backdrop-filter: blur(8px); opacity: 0; transition: opacity .2s, background .2s; }

/* ---- avantajlar */
.sh-usps { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-top: -14px; }

/* ---- kayan marka şeridi */
.sh-marquee { position: relative; margin: -6px calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding: 14px 0; background: #0b1020; transform: rotate(-1.2deg); overflow: hidden; box-shadow: 0 16px 30px -24px rgb(0 0 0 / .6); }
.sh-marquee-in { display: flex; width: max-content; animation: marquee 38s linear infinite; }
.sh-marquee span { display: inline-flex; align-items: center; gap: 26px; padding-right: 26px; font: 800 30px/1 var(--f-display); letter-spacing: .04em; color: #fff; white-space: nowrap; }
.sh-marquee span:nth-child(even) { color: transparent; -webkit-text-stroke: 1.2px rgb(255 255 255 / .7); }
.sh-marquee i { font-style: normal; font-size: 18px; color: var(--price); -webkit-text-stroke: 0; }
@keyframes marquee { to { transform: translateX(-50%); } }
.sh-marquee:hover .sh-marquee-in { animation-play-state: paused; }

/* ---- marka kare kutuları */
.sh-brands { display: grid; grid-template-columns: repeat(auto-fit, minmax(128px, 1fr)); gap: var(--gap); }
.sh-brand { --c: #111827; position: relative; aspect-ratio: 1; border-radius: 22px; overflow: hidden; isolation: isolate; display: grid; place-items: center; color: #fff; text-align: center;
  background: radial-gradient(120% 90% at 0% 0%, color-mix(in oklab, var(--c) 70%, #fff) 0%, var(--c) 45%, color-mix(in oklab, var(--c) 70%, #000) 100%);
  box-shadow: inset 0 0 0 1px rgb(255 255 255 / .12), 0 14px 28px -20px var(--c); transition: transform .3s var(--ease), box-shadow .3s; container-type: inline-size; }
.sh-brand::before { content: ""; position: absolute; inset: 0; z-index: -1; background-image: radial-gradient(rgb(255 255 255 / .16) 1px, transparent 1.4px); background-size: 14px 14px; -webkit-mask-image: linear-gradient(135deg, transparent 30%, #000); mask-image: linear-gradient(135deg, transparent 30%, #000); }
.sh-brand-glow { position: absolute; inset: 0; z-index: -1; opacity: 0; background: radial-gradient(220px circle at var(--mx, 50%) var(--my, 50%), rgb(255 255 255 / .28), transparent 60%); transition: opacity .3s; }
.sh-brand-word { font: 900 min(42px, calc(112cqw / var(--len, 6)))/.9 var(--f-display); letter-spacing: .01em; padding: 0 10px; white-space: nowrap; text-shadow: 0 6px 20px rgb(0 0 0 / .35); transition: transform .35s var(--spring); }

.sh-brand-f small { font-size: 11px; opacity: .8; }
.sh-brand-arrow { position: absolute; top: 12px; right: 12px; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: rgb(255 255 255 / .16); transform: scale(.6) rotate(-45deg); opacity: 0; transition: transform .3s var(--spring), opacity .2s; }
@media (hover: hover) {
  .sh-brand:hover { transform: translateY(-6px) rotate(-1deg); box-shadow: inset 0 0 0 1px rgb(255 255 255 / .2), 0 26px 40px -22px var(--c); }
  .sh-brand:hover .sh-brand-glow { opacity: 1; }
  .sh-brand:hover .sh-brand-word, .sh-brand:hover .sh-brand-logo { transform: scale(1.08); }
  .sh-brand:hover .sh-brand-arrow { transform: none; opacity: 1; }
}

/* ---- kare reklam kutuları (bento) */
.sh-bento { container-type: inline-size; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-auto-rows: calc((100cqw - 3 * var(--gap)) / 4); gap: var(--gap); grid-auto-flow: dense; }
@supports not (width: 1cqw) { .sh-bento { grid-auto-rows: 240px; } }
.sh-box { --c: #0f172a; position: relative; border-radius: 24px; overflow: hidden; isolation: isolate; text-align: left; color: #fff; display: flex; align-items: flex-end;
  background: linear-gradient(145deg, color-mix(in oklab, var(--c) 78%, #fff) 0%, var(--c) 50%, color-mix(in oklab, var(--c) 65%, #000)); transition: transform .3s var(--ease), box-shadow .3s; container-type: inline-size; }
.sh-box.sz-wide { grid-column: span 2; } .sh-box.sz-tall { grid-row: span 2; } .sh-box.sz-big { grid-column: span 2; grid-row: span 2; }
.sh-box::before { content: ""; position: absolute; right: -18%; top: -18%; width: 70%; aspect-ratio: 1; border-radius: 50%; z-index: -1; border: 26px solid rgb(255 255 255 / .07); transition: transform .6s var(--ease); }
.sh-box::after { content: ""; position: absolute; inset: 0; z-index: 2; pointer-events: none; opacity: 0; background: radial-gradient(260px circle at var(--mx, 50%) var(--my, 50%), rgb(255 255 255 / .18), transparent 60%); transition: opacity .3s; }

.sh-box.has-img .sh-box-shade { opacity: .95; }
.sh-box-t { display: flex; flex-direction: column; gap: 8px; padding: clamp(16px, 2.2vw, 26px); max-width: 92%; }

.sh-box-t small { font-size: 14px; opacity: .85; }
.sh-box-go { position: absolute; top: 16px; right: 16px; width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; background: rgb(255 255 255 / .16); border: 1px solid rgb(255 255 255 / .22); backdrop-filter: blur(6px); transition: transform .35s var(--spring), background .2s; }
@media (hover: hover) {
  .sh-box:hover { transform: translateY(-4px); box-shadow: 0 26px 46px -26px color-mix(in oklab, var(--c) 80%, #000); }
  .sh-box:hover .sh-box-img { transform: scale(1.07); }
  .sh-box:hover::before { transform: scale(1.15) rotate(20deg); }
  .sh-box:hover::after { opacity: 1; }
  .sh-box:hover .sh-box-go { transform: rotate(-45deg) scale(1.08); background: #fff; color: var(--c); }
}

/* ---- ürün rafları */
.sh-rail { display: grid; grid-auto-flow: column; grid-auto-columns: calc((100% - 5 * var(--gap)) / 6); gap: var(--gap); overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; padding: 6px 2px 14px; margin: -6px -2px -14px; scroll-behavior: smooth; }
.sh-rail::-webkit-scrollbar { display: none; }
.sh-rail > * { scroll-snap-align: start; }
@media (max-width: 1200px) { .sh-rail { grid-auto-columns: calc((100% - 3 * var(--gap)) / 4); } }
.sh-arrows { display: flex; gap: 6px; } .sh-arrow { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; border: 1px solid var(--line); background: var(--surface); color: var(--fg); transition: background .15s, transform .15s; } .sh-arrow:hover:not(:disabled) { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); } .sh-arrow:disabled { opacity: .35; }
.sh-head-r { display: flex; align-items: center; gap: 12px; }
.sh-card { position: relative; display: flex; flex-direction: column; border-radius: 20px; background: var(--surface); border: 1px solid var(--line); overflow: hidden; isolation: isolate; transition: transform .25s var(--ease), box-shadow .25s, border-color .2s; }
.sh-card::after { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0; background: radial-gradient(240px circle at var(--mx, 50%) var(--my, 50%), color-mix(in oklab, var(--accent) 10%, transparent), transparent 65%); transition: opacity .3s; }
.sh-card-img { position: relative; display: block; padding: 16px; background: #fff; border-bottom: 1px solid var(--line-2); }
.sh-card-img .thumb { width: 100%; border: 0; border-radius: 12px; background: #fff; }
.sh-card-img .thumb img { transition: transform .45s var(--ease); }
.sh-new { position: absolute; top: 12px; left: 12px; height: 24px; padding: 0 10px; border-radius: 12px; display: inline-flex; align-items: center; font: 800 11px/1 var(--f-body); letter-spacing: .1em; color: #fff; background: linear-gradient(135deg, var(--price), #ff9a3c); box-shadow: 0 6px 14px -6px var(--price); }
.sh-card-b { display: flex; flex-direction: column; gap: 6px; padding: 12px 14px 14px; flex: 1; }

.sh-card-n { text-align: left; font-weight: 600; font-size: 14px; line-height: 1.32; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 2.64em; }
.sh-card-f { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: auto; padding-top: 4px; }
.sh-card-p { font: 800 24px/1 var(--f-display); color: var(--price); }
.sh-add { position: relative; width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); transition: transform .2s var(--spring), background .15s, color .15s; }
.sh-add-plus { position: absolute; top: 7px; right: 6px; background: var(--surface); border-radius: 50%; }

@media (hover: hover) {
  .sh-card:hover { transform: translateY(-5px); border-color: color-mix(in oklab, var(--accent) 40%, var(--line)); box-shadow: 0 22px 40px -26px rgb(10 20 40 / .45); }
  .sh-card:hover::after { opacity: 1; }
  .sh-card:hover .sh-card-img .thumb img { transform: scale(1.07); }

}

/* ---- alt WhatsApp bandı */
.sh-cta { position: relative; overflow: hidden; isolation: isolate; display: flex; align-items: center; justify-content: space-between; gap: 18px; flex-wrap: wrap; padding: clamp(22px, 4vw, 40px); border-radius: 26px; color: #fff; background: #071a10; }
.sh-cta::before { content: ""; position: absolute; z-index: -1; width: 60%; aspect-ratio: 1; right: -10%; top: -80%; border-radius: 50%; background: #1fa855; filter: blur(80px); opacity: .55; }
.sh-cta b { font: 800 clamp(26px, 3vw, 38px)/1 var(--f-display); }
.sh-cta p { margin: 8px 0 0; opacity: .8; max-width: 52ch; }

.sh-cta-ghost:hover { background: rgb(255 255 255 / .1); }

/* ---- kaydırınca belirme */
.rv { opacity: 0; transform: translateY(26px); transition: opacity .7s var(--ease), transform .7s var(--ease); }
.rv.in { opacity: 1; transform: none; }
.rv .sh-brand, .rv .sh-box, .rv .sh-card, .rv .sh-usp { opacity: 0; transform: translateY(18px) scale(.98); }
.rv.in .sh-brand, .rv.in .sh-box, .rv.in .sh-card, .rv.in .sh-usp { opacity: 1; transform: none; transition: opacity .55s var(--ease) calc(var(--i, 0) * 55ms), transform .55s var(--ease) calc(var(--i, 0) * 55ms), box-shadow .3s; }

/* ---- telefon / tablet */
@media (max-width: 900px) {
  .sh-slide { grid-template-columns: 1fr; align-content: center; padding-bottom: 64px; }
  .sh-slide-art { position: absolute; right: -8%; bottom: -6%; width: 62%; min-height: 0; height: auto; opacity: .9; z-index: -1; }
  .sh-slide-art.word { opacity: .35; }
  .sh-float { max-height: 220px; }
  .sh-hero-nav { display: none; }
  .sh-usps { display: flex; overflow-x: auto; scrollbar-width: none; margin-inline: -16px; padding-inline: 16px; scroll-snap-type: x mandatory; } .sh-usps::-webkit-scrollbar { display: none; } .sh-usp { flex: 0 0 auto; scroll-snap-align: start; padding-right: 20px; } .sh-usp small { white-space: nowrap; }
}
@media (max-width: 700px) {
  .sh { gap: 30px; --gap: 12px; }
  .sh-hero { border-radius: 22px; margin-inline: -4px; }
  .sh-slide { min-height: 470px; align-content: start; padding-top: 34px; }
  .sh-bento { grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: calc((100cqw - var(--gap)) / 2); }
  .sh-box { border-radius: 20px; }
  .sh-brands { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .sh-brand { border-radius: 18px; } .sh-brand-f { font-size: 10.5px; left: 10px; right: 10px; bottom: 8px; } .sh-brand-f small { display: none; }
  .sh-rail { grid-auto-columns: 46%; margin-inline: -16px; padding: 6px 16px 14px; scroll-padding-inline: 16px; }
  .sh-arrows { display: none; }
  .sh-card-p { font-size: 21px; }
  .sh-marquee span { font-size: 24px; }
  .sh-usp { padding: 12px; } .sh-usp-ic { width: 36px; height: 36px; }
}
@media (prefers-reduced-motion: reduce) { .rv, .rv .sh-brand, .rv .sh-box, .rv .sh-card, .rv .sh-usp { opacity: 1 !important; transform: none !important; } .sh-marquee-in, .sh-orb, .sh-halo, .sh-float { animation: none !important; } }
.sh { overflow-x: clip; }
/* mağaza ana sayfası düzenleyici */
.rot90 { transform: rotate(90deg); } .rot-90 { transform: rotate(-90deg); }
