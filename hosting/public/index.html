/* tasarım modu tutamaçları */
.sh-vh { position: absolute; z-index: 3; opacity: 0; transition: opacity .15s; }
.dz-blk:hover .sh-vh, .dz-on .sh-vh, .sh-video-in.dragging .sh-vh { opacity: 1; }
.sh-vh-move { top: -15px; left: 50%; translate: -50% 0; display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 15px; font: 600 12.5px/1 var(--f-body);
  color: var(--fg); background: color-mix(in oklab, var(--surface) 94%, transparent); box-shadow: 0 4px 14px -6px rgb(0 0 0 / .4); cursor: grab; touch-action: none; }
.sh-vh-l, .sh-vh-r { top: 50%; width: 10px; height: 54px; margin-top: -27px; border-radius: 6px; background: var(--surface); box-shadow: 0 0 0 1px var(--line), 0 4px 12px -4px rgb(0 0 0 / .4); cursor: ew-resize; touch-action: none; }
.sh-vh-l { left: 8px; } .sh-vh-r { right: 8px; }
.sh-video-in.dragging { outline: 2px dashed var(--accent); outline-offset: 6px; border-radius: 18px; }
.vid-item { display: grid; gap: 6px; padding-bottom: 10px; border-bottom: 1px dashed var(--line); margin-bottom: 4px; }

/* yönetim sipariş detayı: kart başlığında küçük kopyala simgesi, fatura rozeti */
.o-card h3 { display: flex; align-items: center; gap: 8px; }
.oc-copy { margin-left: auto; width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; color: var(--muted); border: 1px solid transparent; transition: background .15s, color .15s; }
.oc-copy:hover { color: var(--accent); background: var(--accent-soft); }
.tag.ok { background: color-mix(in oklab, var(--ok, #1f9d55) 14%, transparent); color: var(--ok, #1f9d55); border-color: color-mix(in oklab, var(--ok, #1f9d55) 30%, transparent); }
.o-card.inv-yes { border-color: color-mix(in oklab, var(--ok, #1f9d55) 45%, var(--line)); background: color-mix(in oklab, var(--ok, #1f9d55) 5%, var(--surface)); }
/* masaüstü: geniş kartlarda basma küçülmesi kartı "fırlatıyordu" → çok hafif */
@media (hover: hover) { .ocard:active, .rcard:active, .ucard:active { transform: scale(.995) !important; } }

.sfoot.compact { margin-top: 18px; }
.sfoot-mini { max-width: 1320px; margin: 0 auto; padding: 14px 16px; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 6px 18px; font-size: 13px; color: var(--muted); }
.sfoot-mini button { padding: 0; font-size: 13px; color: var(--muted); font-weight: 600; }
.sfoot-mini button:hover, .sfoot-mini a:hover { color: var(--accent); }
.sfoot-mini a { color: var(--muted); display: inline-grid; place-items: center; }

/* Hesabım (üye): profil başlığı + satırlar (iOS ayarları gibi) */
.acct-hub { max-width: 620px; }
.hub-head { display: flex; align-items: center; gap: 16px; padding: 8px 4px 20px; }
.hub-av { position: relative; padding: 0; border-radius: 50%; flex: none; }
.hub-av.busy { opacity: .5; }
.hub-cam { position: absolute; right: -2px; bottom: -2px; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: var(--accent-ink, #fff); box-shadow: 0 0 0 3px var(--bg); }
.hub-id { min-width: 0; }
.hub-id h1 { margin: 0; font: 700 26px/1.1 var(--f-display); }
.hub-id p { margin: 4px 0 0; overflow-wrap: anywhere; }
.hub-id .linkish { margin-top: 6px; font-size: 13px; }
.hub-list { list-style: none; margin: 0; padding: 0; border-radius: 18px; overflow: hidden; background: var(--surface); border: 1px solid var(--line); }
.hub-list li + li { border-top: 1px solid var(--line-2); }
.hub-row { width: 100%; display: flex; align-items: center; gap: 14px; padding: 15px 16px; text-align: left; }
.hub-row:hover { background: var(--surface-2); }
.hub-ic { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; flex: none; color: var(--accent); background: var(--accent-soft); }
.hub-t { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.hub-t b { font-size: 15.5px; }
.hub-t small { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hub-chev { color: var(--muted); flex: none; }
.soon-tag.sm { font-size: 10px; padding: 2px 7px; margin-left: 8px; vertical-align: 2px; }
.hub-out { margin: 18px auto 0; display: flex; align-items: center; gap: 8px; padding: 12px 18px; border-radius: 12px; color: var(--bad); font-weight: 600; }
.hub-out:hover { background: color-mix(in oklab, var(--bad) 8%, transparent); }
.soon-card.in-sheet { display: grid; justify-items: center; text-align: center; gap: 10px; padding: 12px 6px; }
.mi { gap: 14px; }
/* bu cihazdan verilen siparişler */
.lo-card { padding: 0; overflow: hidden; }
.lo-h { width: 100%; display: flex; align-items: center; gap: 10px; padding: 16px 18px; text-align: left; }
.lo-h b { flex: 1; }
.lo-card > .lo-bar, .lo-card > .olist, .lo-card > .fine { margin: 0 18px 14px; }
.lo-bar { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.rot180 { transform: rotate(180deg); }
.lo-h .ic { transition: transform .2s var(--ease); }

/* kart resmi: üstüne gelince küçük resimler (kutu görünümü, bilgisayar) */
.cimg { position: relative; display: block; overflow: hidden; }
.plist:not(.pgrid) .cimg { display: contents; }
.plist:not(.pgrid) .cimg > :not(.thumb) { display: none; }
.cimg-alt { position: absolute; inset: 12px 12px auto; width: calc(100% - 24px); aspect-ratio: 1; object-fit: contain; background: #fff; border-radius: 8px; opacity: 0; transition: opacity .2s ease; pointer-events: none; }
.cimg-alt.on { opacity: 1; }
.cimg-strip { position: absolute; left: 0; right: 0; bottom: 0; display: flex; justify-content: center; gap: 6px; padding: 8px 10px 10px; background: linear-gradient(transparent, rgb(255 255 255 / .96) 35%); animation: cimg-up .25s var(--ease) both; }
.cimg-th { width: 40px; height: 40px; border-radius: 8px; overflow: hidden; background: #fff; border: 1.5px solid var(--line); flex: none; cursor: pointer; transition: border-color .15s, transform .15s; }
.cimg-th img { width: 100%; height: 100%; object-fit: contain; }
.cimg-th.on { border-color: var(--accent); transform: translateY(-2px); }
.cimg-bar { position: absolute; left: 14px; right: 14px; bottom: 64px; display: flex; gap: 4px; animation: cimg-up .25s var(--ease) both; }
.cimg-bar i { flex: 1; height: 3px; border-radius: 2px; background: rgb(15 23 42 / .15); transition: background .2s; }
.cimg-bar i.on { background: var(--accent); }
@keyframes cimg-up { from { opacity: 0; transform: translateY(14px); } }
.plist.pgrid > li.prow:hover .cimg.multi .thumb img { transform: none; }
/* bayi: liste ve toptan yan yana, eşit boy */
.price.dual { flex-direction: row; flex-wrap: wrap; align-items: flex-end; justify-content: flex-start; gap: 4px 14px; min-width: 0; }
.price.dual .pv { display: flex; flex-direction: column; gap: 3px; }
.price.dual .pv small { font: 600 10px/1 var(--f-body); letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.price.dual .pv b { font: 700 19px/1 var(--f-display); font-variant-numeric: tabular-nums; color: var(--fg); }
.price.dual .pv.mine small, .price.dual .pv.mine b { color: var(--price); }
.price.dual .tl-hint { flex-basis: 100%; }
.plist.pgrid .prow-side:has(.price.dual) { flex-direction: column; align-items: stretch; }
.plist.pgrid .prow-side:has(.price.dual) .btn.add, .plist.pgrid .prow-side:has(.price.dual) .stepper { width: 100%; justify-content: center; }
.plist:not(.pgrid) .price.dual { justify-content: flex-end; }

.sh-brand-cta { display: inline-flex; align-items: center; gap: 3px; margin-left: auto; font-weight: 700; color: var(--accent); opacity: .85; transition: gap .2s var(--ease), opacity .2s; }
.sh-brand:hover .sh-brand-cta { gap: 6px; opacity: 1; }
/* ürün açıklaması: bilgisayarda da baştan tam ("Devamını göster" yok) */
.pdesc .pdesc-body { max-height: none; }
.pdesc .pdesc-body::after, .pdesc > .link { display: none; }

/* ---- Fiyat gösterimi: +KDV, soluk KDV dahil satırı ---- */
.plusvat { font: 600 10px/1 var(--f-body); font-style: normal; letter-spacing: .02em; color: var(--muted); margin-left: 4px; align-self: flex-start; padding-top: 2px; }
.price.big .plusvat { font-size: 12px; }
.vat-inc { font-size: 10.5px; color: var(--muted); opacity: .62; font-weight: 500; letter-spacing: .01em; }
.price.big .vat-inc { font-size: 12px; }
.price.dual .vat-inc { flex-basis: 100%; }
.pshow { gap: 3px; }
.pshow-main { display: flex; align-items: baseline; font: 700 22px/1.1 var(--f-display); color: var(--price); }

/* ---- Kademeli indirim tablosu (Ayarlar > Fiyatlandırma) ---- */
.steps-ed { display: flex; flex-direction: column; gap: 6px; padding: 12px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface-2); }
.steps-h { display: grid; grid-template-columns: minmax(0, 1fr) 112px 34px; gap: 8px; font: 600 11px/1 var(--f-body); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding: 0 4px 2px; }
.steps-row { display: grid; grid-template-columns: minmax(0, 1fr) 112px 34px; gap: 8px; align-items: center; }
.steps-range { display: flex; align-items: center; gap: 8px; min-width: 0; font-variant-numeric: tabular-nums; }
.steps-from { min-width: 72px; font-weight: 600; white-space: nowrap; }
.steps-up { color: var(--muted); font-weight: 600; }
.steps-to { display: flex; align-items: center; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface); padding-right: 8px; width: 112px; }
.steps-to input, .steps-off input { border: 0; box-shadow: none; min-width: 0; width: 100%; text-align: right; padding-inline: 8px; background: transparent; }
.steps-to small { color: var(--muted); font-size: 11px; }
.steps-off { display: flex; align-items: center; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface); padding: 0 8px; color: var(--price); font-weight: 700; }
.steps-off input { color: var(--price); font-weight: 700; }
.steps-row.bad .steps-to { border-color: var(--bad); box-shadow: 0 0 0 3px color-mix(in oklab, var(--bad) 15%, transparent); }
.bad-t { color: var(--bad); }
.steps-ed > .btn { align-self: flex-start; margin-top: 4px; }
@media (max-width: 480px) { .steps-from { min-width: 0; } .steps-to { width: 96px; } .steps-h, .steps-row { grid-template-columns: minmax(0, 1fr) 92px 30px; } }
.tier-box { display: flex; flex-direction: column; gap: 8px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
.tier-list { display: flex; flex-direction: column; gap: 12px; }
.pct-in span { font-size: 12px; white-space: nowrap; }
.ptest { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding: 12px 14px; border-radius: var(--r-sm); background: var(--price-soft); }
.ptest-in { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; }
.ptest-in input { width: 84px; text-align: right; }
.ptest-out { display: flex; flex-wrap: wrap; gap: 6px 18px; }
.ptest-out span { display: flex; flex-direction: column; gap: 2px; }
.ptest-out small { font-size: 11px; color: var(--muted); font-weight: 600; }
.ptest-out b { color: var(--price); font-size: 16px; }

/* ---- Serbest kutu (FreeBox) + Kur kutusu ---- */
.fbox-row { display: flex; align-items: center; width: 100%; }
.fbox-sp { flex: 1 1 0; min-width: 0; }
.fbox { position: relative; flex: none; max-width: 100%; font-size: calc(13px * var(--sc, 1)); }
.fbox.editable { cursor: grab; touch-action: none; }
.fbox.editable:hover { outline: 1.5px dashed color-mix(in oklab, var(--accent) 55%, transparent); outline-offset: 5px; border-radius: 12px; }
.fbox.dragging { cursor: grabbing; outline: 1.5px solid var(--accent); outline-offset: 5px; border-radius: 12px; }
.fbox-size { position: absolute; right: -11px; bottom: -11px; width: 14px; height: 14px; border-radius: 50%; background: var(--surface); border: 2px solid var(--accent); cursor: nwse-resize; opacity: 0; transition: opacity .15s; }
.fbox.editable:hover .fbox-size, .fbox.dragging .fbox-size { opacity: 1; }
.sh-rate { padding: 4px 0; }
.rate-pill { display: inline-flex; align-items: center; gap: .55em; padding: .5em .95em; border-radius: 999px; font-size: 1em; line-height: 1.2; white-space: nowrap; color: var(--muted); background: color-mix(in oklab, var(--surface-2) 70%, transparent); }
.rate-pill b { color: var(--fg); font-weight: 650; font-size: 1.04em; }
.rate-pill small { font-size: .84em; opacity: .75; }
.rate-pill .rate-l { font-weight: 500; }
.rate-dot { width: .5em; height: .5em; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 .22em color-mix(in oklab, var(--ok) 22%, transparent); flex: none; }
.rate-pill.st-line { background: var(--surface); border: 1px solid var(--line); }
.rate-pill.st-dark { background: #111827; color: #cbd5e1; }
.rate-pill.st-dark b { color: #fff; }
@media (max-width: 560px) { .rate-pill { gap: .45em; padding: .45em .8em; } .rate-pill .rate-l { max-width: 46vw; overflow: hidden; text-overflow: ellipsis; } }
.page-h.fixh { min-height: 44px; }
.price.dual .tl-hint { text-align: left; }
</style>
