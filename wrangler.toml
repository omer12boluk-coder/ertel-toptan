# Cloudflare Worker ayarı (GitHub "Bekçiyi yayınla" işi tarafından yüklenir)
name = "ertel-b2b-watch"
main = "worker/index.js"
compatibility_date = "2025-06-01"
workers_dev = true # uygulamanın kullandığı küçük web adresi (/rate, /sync)

# Ürün videoları (deneme): worker/media/_m/ içindeki dosyalar /v/<ad> adresinden parça parça (Range) verilir
[assets]
directory = "./worker/media"
binding = "ASSETS"

[triggers]
crons = ["* * * * *"]

# Resim deposu (R2 kutusu "ertel"): taşıma işi /r2obj/ kapısından yazar (anahtarlı)
[[r2_buckets]]
binding = "R2"
bucket_name = "ertel"

[[kv_namespaces]]
binding = "KV"
id = "__KV_ID__"

[vars]
FEED_URL = "https://www.ertelgsm.com/xml-cikti/gm"
REPO = "omer12boluk-coder/ertel-toptan"
# sipariş bildirimi (Ayarlar > Online mağaza > Bildirimler'de anlatılıyor)
NOTIFY_EMAIL = "omer.12boluk@gmail.com"
