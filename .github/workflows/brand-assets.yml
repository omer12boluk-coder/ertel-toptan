name: Marka logolarını getir
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node tools/fetch-logos.mjs
      - name: Sonuçları brand-assets dalına yükle
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git checkout --orphan brand-assets-tmp
          git rm -rf --cached . >/dev/null
          git add brand-assets
          git commit -m "Marka logoları (otomatik indirme)"
          git push -f origin HEAD:brand-assets
