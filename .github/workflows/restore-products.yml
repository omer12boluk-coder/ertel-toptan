# Yanlışlıkla katalogdan kaldırılan ürünleri ilk veriden (src/products.json) pasif olarak geri koyar
name: Ürün geri yükle
on:
  workflow_dispatch:
    inputs:
      codes:
        description: 'Stok kodları (virgülle)'
        required: true
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save --no-package-lock firebase-admin@12
      - env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node tools/restore-products.mjs "${{ inputs.codes }}"
