# E-posta alan adı kurulumu (ertelmarket.com). 1) Resend: siparis@ertelmarket.com (DKIM/SPF send. alt adında) + DMARC
# 2) Firebase Auth e-postaları (doğrulama / şifre sıfırlama) noreply@ertelmarket.com: TXT firebase=…, 2 DKIM CNAME,
#    kök SPF'e _spf.firebasemail.com eklenir (Cloudflare Email Routing'in SPF'i ile TEK kayıtta birleştirilir).
# Kayıtlar herkese açık DNS bilgisidir. Anahtarlar günlüğe yazılmaz.
name: E-posta alan adı kurulumu
on:
  push:
    branches: [eposta]
    paths: ['.github/workflows/email-setup.yml']
  workflow_dispatch:
jobs:
  setup:
    runs-on: ubuntu-latest
    env:
      RK: ${{ secrets.RESEND_KEY }}
      T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      D: ertelmarket.com
    steps:
      - name: Kur
        run: |
          rs() { curl -s -H "Authorization: Bearer $RK" -H 'Content-Type: application/json' "$@"; }
          cf() { curl -s -H "Authorization: Bearer $T" -H 'Content-Type: application/json' "$@"; }
          Z=$(cf "https://api.cloudflare.com/client/v4/zones?name=$D" | jq -r '.result[0].id // empty')
          [ -n "$Z" ] || { echo "::error title=Cloudflare::zone bulunamadı"; exit 1; }
          API="https://api.cloudflare.com/client/v4/zones/$Z/dns_records"
          add() { # tip ad içerik [öncelik]
            ex=$(cf "$API?type=$1&name=$2" | jq -r --arg c "$3" '[.result[]? | select((.content|ltrimstr("\"")|rtrimstr("\"")|rtrimstr(".")) == ($c|rtrimstr(".")))] | length')
            if [ "$ex" != "0" ]; then echo "::notice title=DNS var::$1 $2"; return; fi
            body=$(jq -nc --arg t "$1" --arg n "$2" --arg c "$3" --arg p "${4:-}" '{type:$t,name:$n,content:$c,ttl:1,proxied:false} + (if $p != "" then {priority:($p|tonumber)} else {} end)')
            echo "::notice title=DNS $1 $2::$(cf -X POST "$API" -d "$body" | jq -c '{success, errors:[.errors[]?.message]}')"
          }
          # --- Firebase Auth özel alan adı ---
          add TXT "$D" "firebase=erteltoptan"
          add CNAME "firebase1._domainkey.$D" "mail-ertelmarket-com.dkim1._domainkey.firebasemail.com"
          add CNAME "firebase2._domainkey.$D" "mail-ertelmarket-com.dkim2._domainkey.firebasemail.com"
          # kök SPF: tek kayıt olmalı → varsa firebasemail eklenir, yoksa oluşturulur
          spf=$(cf "$API?type=TXT&name=$D" | jq -c '[.result[]? | select(.content|ltrimstr("\"")|startswith("v=spf1"))]')
          n=$(echo "$spf" | jq length)
          if [ "$n" = "0" ]; then add TXT "$D" "v=spf1 include:_spf.mx.cloudflare.net include:_spf.firebasemail.com ~all"
          else
            id=$(echo "$spf" | jq -r '.[0].id'); cur=$(echo "$spf" | jq -r '.[0].content' | sed 's/^"//; s/"$//')
            if echo "$cur" | grep -q '_spf.firebasemail.com'; then echo "::notice title=SPF::zaten var: $cur"
            else new=$(echo "$cur" | sed 's/ \([~-]\)all$/ include:_spf.firebasemail.com \1all/'); [ "$new" = "$cur" ] && new="$cur include:_spf.firebasemail.com"
              echo "::notice title=SPF güncellendi::$(cf -X PATCH "$API/$id" -d "$(jq -nc --arg c "$new" '{content:$c}')" | jq -c '{success, content:.result.content, errors:[.errors[]?.message]}')"; fi
            [ "$n" -gt 1 ] && echo "::warning title=SPF::kökte $n SPF kaydı var, tek olmalı"
          fi
          # --- Resend (sipariş e-postaları) ---
          id=$(rs https://api.resend.com/domains | jq -r --arg d "$D" '.data[]? | select(.name==$d) | .id' | head -1)
          if [ -n "$id" ]; then rs -X POST https://api.resend.com/domains/$id/verify >/dev/null; sleep 20
            echo "::notice title=Resend::$(rs https://api.resend.com/domains/$id | jq -c '{status, records:[.records[]|{name,status}]}')"; fi
