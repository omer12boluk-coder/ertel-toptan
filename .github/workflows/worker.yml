# Cloudflare'deki site bekçisini yükler (worker/ değişince ya da elle)
name: Bekçiyi yayınla
on:
  push:
    branches: [main]
    paths: ['worker/**', 'wrangler.toml', '.github/workflows/worker.yml']
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      RESEND_KEY: ${{ secrets.RESEND_KEY }}
      DHL_USER: ${{ secrets.DHL_USER }}
      DHL_PASS: ${{ secrets.DHL_PASS }}
      FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Ayarlar tamam mı
        id: ok
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$GH_DISPATCH_TOKEN" ]; then
            echo "::warning title=Bekçi kurulmadı::CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID ve GH_DISPATCH_TOKEN gizli ayarları eklenince çalışır."
            echo "go=no" >> $GITHUB_OUTPUT
          else echo "go=yes" >> $GITHUB_OUTPUT; fi
      - name: Depo (KV) hazırla
        if: steps.ok.outputs.go == 'yes'
        run: |
          set -e
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces"
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          id=$(curl -s -H "$auth" "$api?per_page=100" | node -e 'const r=JSON.parse(require("fs").readFileSync(0));if(!r.success){console.error(JSON.stringify(r.errors));process.exit(1)}const n=r.result.find(x=>x.title==="ertel-b2b-sync");console.log(n?n.id:"")')
          if [ -z "$id" ]; then
            id=$(curl -s -X POST -H "$auth" -H "Content-Type: application/json" "$api" -d '{"title":"ertel-b2b-sync"}' | node -e 'const r=JSON.parse(require("fs").readFileSync(0));if(!r.success){console.error(JSON.stringify(r.errors));process.exit(1)}console.log(r.result.id)')
          fi
          sed -i "s/__KV_ID__/$id/" wrangler.toml
      - name: workers.dev adresi hazırla
        if: steps.ok.outputs.go == 'yes'
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain"
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          sub=$(curl -s -H "$auth" "$api" | node -e 'try{const r=JSON.parse(require("fs").readFileSync(0));console.log(r.result&&r.result.subdomain||"")}catch(e){console.log("")}')
          if [ -z "$sub" ]; then
            for name in ertelgsm ertel-b2b ertel-b2b-$RANDOM; do
              ok=$(curl -s -X PUT -H "$auth" -H "Content-Type: application/json" "$api" -d "{\"subdomain\":\"$name\"}" | node -e 'const r=JSON.parse(require("fs").readFileSync(0));console.log(r.success?"1":"")')
              if [ -n "$ok" ]; then sub=$name; break; fi
            done
          fi
          echo "SUB=$sub" >> $GITHUB_ENV
          echo "::notice title=Bekçi adresi::https://ertel-b2b-watch.$sub.workers.dev"

      - name: Yükle
        if: steps.ok.outputs.go == 'yes'
        run: |
          set -o pipefail
          npx -y wrangler@3 deploy 2>&1 | tail -n 20 | tee out.txt || { echo "::error title=Yükleme hatası::$(tail -n 8 out.txt | tr '\n' ' ')"; exit 1; }
          printf '%s' "$GH_DISPATCH_TOKEN" | npx -y wrangler@3 secret put GH_TOKEN 2>&1 | tail -n 5 | tee out2.txt || { echo "::error title=Gizli ayar hatası::$(tail -n 5 out2.txt | tr '\n' ' ')"; exit 1; }
          if [ -n "$TELEGRAM_TOKEN" ]; then printf '%s' "$TELEGRAM_TOKEN" | npx -y wrangler@3 secret put TELEGRAM_TOKEN 2>&1 | tail -n 3; else echo "::warning title=Telegram bildirimi kapalı::TELEGRAM_TOKEN gizli ayarı eklenince açılır."; fi
          if [ -n "$RESEND_KEY" ]; then printf '%s' "$RESEND_KEY" | npx -y wrangler@3 secret put RESEND_KEY 2>&1 | tail -n 3; else echo "::warning title=E-posta bildirimi kapalı::RESEND_KEY gizli ayarı eklenince açılır."; fi
          if [ -n "$DHL_USER" ] && [ -n "$DHL_PASS" ]; then printf '%s' "$DHL_USER" | npx -y wrangler@3 secret put DHL_USER 2>&1 | tail -n 2; printf '%s' "$DHL_PASS" | npx -y wrangler@3 secret put DHL_PASS 2>&1 | tail -n 2; fi
          if [ -n "$FIREBASE_SA" ]; then printf '%s' "$FIREBASE_SA" | npx -y wrangler@3 secret put FIREBASE_SA 2>&1 | tail -n 2; else echo "::warning title=Sunucu siparişi kapalı::FIREBASE_SERVICE_ACCOUNT gizli ayarı yok"; fi
          echo "::notice title=Bekçi yayında::Dakikada bir siteyi kontrol ediyor."
      - name: Kur kontrol (Harem Altın)
        if: steps.ok.outputs.go == 'yes'
        continue-on-error: true
        run: |
          sleep 15
          out=$(curl -s -m 20 "https://ertel-b2b-watch.$SUB.workers.dev/rate" || true)
          echo "::notice title=Kur cevabı::$out"
          curl -s -m 30 "https://ertel-b2b-watch.$SUB.workers.dev/rate?debug=1" > dbg.json || true; dbg=$(node -e 'try{const d=JSON.parse(require("fs").readFileSync("dbg.json","utf8"));for(const[k,v]of Object.entries(d))for(const x of [].concat(v))console.log(k+" :: "+(typeof x==="string"?x:JSON.stringify(x)))}catch(e){console.log("dbg read fail")}' | head -c 6000 | sed "s/%/%25/g" | awk '{printf "%s%%0A", $0}')
          echo "::notice title=Kur teşhis::$dbg"
