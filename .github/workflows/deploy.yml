# main dalına her gönderimde uygulamayı ve güvenlik kurallarını Firebase'e yayınlar
name: Yayınla
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Firebase'e yükle
        working-directory: hosting
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          set +e
          npx -y firebase-tools@13 deploy --only hosting,firestore:rules --project erteltoptan --non-interactive > "$RUNNER_TEMP/out.txt" 2>&1
          code=$?
          cat "$RUNNER_TEMP/out.txt"
          if [ $code -ne 0 ]; then
            msg=$(grep -v '^\s*$' "$RUNNER_TEMP/out.txt" | tail -n 12 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Firebase yükleme hatası::$msg"
            exit $code
          fi
          grep -i "Hosting URL" "$RUNNER_TEMP/out.txt" | sed 's/^/::notice title=Yayında::/'
