name: Site teşhis (sadece okuma)
on:
  push:
    branches: [probe-2uul]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Dene
        run: |
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36'
          probe() {
            code=$(curl -g -sS -L --max-time 25 -A "$UA" -H 'Accept: text/html,*/*' -o /tmp/b -w '%{http_code} %{size_download}B %{url_effective}' "$1" || echo hata)
            forms=$(grep -o -i '<form[^>]*>' /tmp/b | head -4 | tr '\n' ' ' | cut -c1-400)
            inputs=$(grep -o -i '<input[^>]*name="[^"]*"[^>]*>' /tmp/b | grep -i -o 'name="[^"]*"' | sort -u | head -12 | tr '\n' ' ')
            links=$(grep -o -i 'href="[^"]*"' /tmp/b | grep -i "$2" | sort -u | head -8 | tr '\n' ' ' | cut -c1-900)
            js=$(grep -o -i 'search[A-Za-z_]*\(Url\|url\|URL\|api\)[^,;]\{0,120\}' /tmp/b | head -3 | tr '\n' ' ' | cut -c1-300)
            echo "::notice title=$1::$code | FORM: $forms | INPUT: $inputs | LINK($2): $links | JS: $js"
          }
          probe "https://www.martview.com/" "products\|search"
          probe "https://www.martview.com/products?search=DA07" "da07\|da-07"
          probe "https://www.martview.com/products?search=V1SE" "v1se"
          probe "https://www.jcprogrammer.com/" "search\|keyword"
          probe "https://www.jcprogrammer.com/search?keyword=V1SE" "v1se"
          probe "https://www.jcprogrammer.com/search/?q=V1SE" "v1se"
