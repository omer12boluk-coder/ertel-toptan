# 23.11.2026 kullanıcı adı kayıtlarından e-postayı kaldır (bir kez; tekrar çalıştırmak zararsız)
name: Kullanıcı adlarından e-postayı kaldır
on: workflow_dispatch
# 23.11.2026 güvenlik: bu iş GitHub anahtarıyla sadece okur (depoya yazamaz)
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save --no-package-lock firebase-admin@12
      - env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node tools/usernames-gizle.mjs
