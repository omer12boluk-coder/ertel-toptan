# GEÇİCİ: Türkiye il/ilçe/mahalle verisini (npm turkey-neighbourhoods) ve DHL servis metot listesini tr-data dalına yazar
name: Adres verisi getir
on: workflow_dispatch
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir out && cd out
          npm pack turkey-neighbourhoods >/dev/null && tar xzf turkey-neighbourhoods-*.tgz && rm *.tgz
          find package -maxdepth 3 | head -50 > files.txt
          curl -s 'https://service.mngkargo.com.tr/musterikargosiparis/musterikargosiparis.asmx?WSDL' | grep -o 'operation name="[^"]*"' | sort -u > dhl-ops.txt
          git init -q && git config user.name bot && git config user.email bot@users.noreply.github.com && git add . && git commit -qm data && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:tr-data
