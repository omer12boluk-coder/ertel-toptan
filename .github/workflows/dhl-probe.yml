name: DHL deneme (geçici)
on:
  workflow_dispatch:
    inputs:
      ref: { default: 'ERTELP4A88E' }
      gno: { default: '' }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node tools/dhl-probe.mjs
        env:
          DHL_USER: ${{ secrets.DHL_USER }}
          DHL_PASS: ${{ secrets.DHL_PASS }}
          REF: ${{ inputs.ref }}
          GNO: ${{ inputs.gno }}
