# Geçici: banner tasarımı için ürün resimlerini indirir (sadece okuma; canlıya dokunmaz)
name: Banner resimleri (geçici)
on:
  push:
    branches: [banner-resim]
permissions:
  contents: write
jobs:
  get:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: indir
        run: |
          mkdir -p out
          while read -r n u; do
            [ -z "$n" ] && continue
            ext="${u##*.}"; ext="${ext%%\?*}"
            curl -sfL --max-time 40 -o "out/$n.$ext" "$u" || echo "::notice::yok $n $u"
          done < tools/banner-list.txt
          ls -la out | head -100
      - name: ayri dala koy
        run: |
          cd out && git init -q && git checkout -q -b banner-resim-out
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add -A && git commit -qm resimler
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" banner-resim-out
