# Geçici: sunucu-siparis dalında derleme + bekçi servis anahtarı denemesi (main'e birleşmeden önce silinecek)
name: Dal denemesi (sunucu sipariş)
on:
  push:
    branches: [sunucu-siparis]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Bekçi servis anahtarı (Firestore yazma/okuma/silme)
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node tools/srv-order-check.mjs
      - name: Derle ve dala yaz
        run: |
          rm -f node_modules && npm i --no-audit --no-fund --silent
          python3 tools/build.py
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hosting/public/index.html DEMO.html hosting/public/version.json hosting/public/seed-products.json hosting/public/seed-desc.json src/setindex.json
          git diff --cached --quiet || { git commit -m "Derleme (dal denemesi)"; git push; }
