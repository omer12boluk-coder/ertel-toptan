# Kalıp bulucu için telefon → işlemci verisini toplar (elle çalıştırılır).
# brands: markaların model listeleri + her telefonun sayfası (önceki çıktıdan devam eder), sonra
# hosting/public/kalip/phones.json'u günceller, main'e yazar ve siteyi yayınlar.
name: Kalıp verisi
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'brands | probe | crawl'
        default: brands
      minutes:
        description: 'En fazla kaç dakika tarasın (brands)'
        default: '300'
permissions:
  contents: write
  actions: write
concurrency:
  group: kalip-data
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Önceki veriyi al
        run: |
          mkdir -p out
          if git fetch -q --depth 1 origin kalip-data 2>/dev/null; then
            git show FETCH_HEAD:phones.json > out/phones.json 2>/dev/null || true
            git show FETCH_HEAD:log.txt > out/log.txt 2>/dev/null || true
          fi
          ls -la out
      - name: Tara
        run: node tools/phone-chips.mjs ${{ inputs.mode }}
        env:
          BUDGET_MIN: ${{ inputs.minutes }}
        timeout-minutes: 330
      - name: kalip-data dalına yaz
        if: always()
        run: |
          cd out
          rm -f search.html phone.html results-*.html
          git init -q -b kalip-data && git add -A
          git -c user.name=bot -c user.email=bot@x commit -qm veri
          git push -qf https://x-access-token:${{ github.token }}@github.com/${{ github.repository }} kalip-data
      - name: Siteye ekle ve yayınla
        if: always() && inputs.mode == 'brands'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -s out/phones.json ] || exit 0
          git pull -q --rebase origin main || true
          node tools/kalip-build.mjs out
          git add hosting/public/kalip/phones.json
          git -c user.name=bot -c user.email=bot@x commit -qm "Kalıp bulucu: telefon listesi güncellendi" || exit 0
          git push -q origin HEAD:main
          gh workflow run deploy.yml --ref main
