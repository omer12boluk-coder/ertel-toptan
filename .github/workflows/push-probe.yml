# Müşteri bildirimi teşhisi (sadece okur): son siparişlerde bildirim işareti ve kayıtlı cihaz sayısı
name: Bildirim teşhis
on:
  workflow_dispatch:
    inputs:
      n:
        description: 'Kaç sipariş'
        default: '8'
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save --no-package-lock firebase-admin@12
      - env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          N: ${{ inputs.n }}
        run: node tools/push-probe.mjs
