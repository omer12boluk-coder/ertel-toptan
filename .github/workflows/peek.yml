name: DHL servis incele (tek seferlik)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  peek:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://service.mngkargo.com.tr/musterikargosiparis/musterikargosiparis.asmx
          { for op in Baglanti_Test SiparisGirisiDetayliV3 MNGGonderiBarkod KargoTakipByReferans MusteriSiparisIptal; do echo "=== $op"; curl -s -m 30 "$B?op=$op" | python3 -c "import sys,html,re; t=sys.stdin.read(); m=re.findall(r'<pre>(.*?)</pre>', t, re.S); print(html.unescape(m[0]) if m else t[:500])" | head -c 6000; echo; done; } > /tmp/peek.txt 2>&1
          mkdir r && cd r && git init -q && git config user.name bot && git config user.email bot@users.noreply.github.com && cp /tmp/peek.txt . && git add . && git commit -qm peek && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:peek-out
