name: Bildirim teşhis (tek seferlik)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  peek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save --no-package-lock firebase-admin@12 >/dev/null 2>&1
      - env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node tools/peek-push.mjs > /tmp/peek.txt 2>&1 || true
      - run: |
          mkdir r && cd r && git init -q && git config user.name bot && git config user.email bot@users.noreply.github.com && cp /tmp/peek.txt . && git add . && git commit -qm peek && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:peek-out
