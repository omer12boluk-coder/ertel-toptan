name: Bildirim teşhis (tek seferlik)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  peek:
    runs-on: ubuntu-latest
    steps:
      - run: |
          W=https://ertel-b2b-watch.omer-12boluk.workers.dev
          { echo "== GET /"; curl -s -m 20 $W/; echo; echo "== notify-test"; curl -s -m 30 -X POST -H 'Content-Type: application/json' -d '{}' $W/notify-test; echo;
            echo "== push/key"; curl -s -m 20 $W/push/key | head -c 120; echo; } > /tmp/peek.txt 2>&1
          git init -q r && cd r && git config user.name bot && git config user.email bot@users.noreply.github.com && cp /tmp/peek.txt . && git add . && git commit -qm peek && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:peek-out
