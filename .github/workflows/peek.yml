name: Besleme incele (tek seferlik)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  peek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/peek-feed.mjs > /tmp/peek.txt 2>&1 || true
      - run: |
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git checkout --orphan peek-out && git rm -rqf . && cp /tmp/peek.txt peek.txt && git add peek.txt && git commit -qm peek && git push -qf origin peek-out
