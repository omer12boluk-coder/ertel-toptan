# Deneme ürünü (video testi) ekler ya da siler — elle çalıştırılır
name: Deneme ürünü
on:
  workflow_dispatch:
    inputs:
      islem:
        description: 'ekle / sil'
        type: choice
        options: [ekle, sil]
        default: ekle
concurrency:
  group: sync
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save --no-package-lock firebase-admin@12
      - name: Çalıştır
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node tools/test-product.mjs ${{ inputs.islem }}
