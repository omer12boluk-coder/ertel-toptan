# Önizleme: resim-adresi / ayarlar-duzen / tasarim-2 / kdv-odeme dalına her gönderimde uygulamayı Firebase ÖNİZLEME kanalına yükler (canlı site değişmez).
name: Önizleme (canlıya dokunmaz)
on:
  push:
    branches: [resim-adresi, ayarlar-duzen, tasarim-2, tasarim-3, kdv-odeme, ekip, kullanim, yasal-iade, ikiz-fiyat, bekleyen, banner-yazi, giris-kaydir, urunler-sabit]
  workflow_dispatch:
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # ekip dalı: güvenlik kuralları canlıya alınmadan denensin diye önizlemede DEMO modu (veriler tarayıcıda, canlı veriye dokunmaz)
      - name: Demo modu (ekip dalı)
        if: github.ref_name == 'ekip' || github.ref_name == 'kullanim'
        run: cp DEMO.html hosting/public/index.html
      - name: Önizleme kanalına yükle
        working-directory: hosting
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          set +e
          CH=$(printf '%s' "$GITHUB_REF_NAME" | tr 'A-Z' 'a-z' | tr -c 'a-z0-9' '-' | cut -c1-40)  # 'claude/…' gibi dal adları kanal adına uygun olsun
          npx -y firebase-tools@13 hosting:channel:deploy "$CH" --expires 7d --project erteltoptan --non-interactive > "$RUNNER_TEMP/out.txt" 2>&1
          code=$?
          cat "$RUNNER_TEMP/out.txt"
          url=$(grep -oE 'https://erteltoptan--[a-z0-9-]+\.web\.app' "$RUNNER_TEMP/out.txt" | head -1)
          [ -n "$url" ] && echo "::notice title=Önizleme adresi::$url"
          exit $code
