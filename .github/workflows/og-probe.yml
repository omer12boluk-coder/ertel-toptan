name: Link önizleme denemesi
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in "https://resim.ertelmarket.com/platin/HENJQFLJSL9272024104728_catalog-kapak-e2a379f0-03b4-4b0c-8fdf-a367237d9030.jpeg" \
                   "https://ertelmarket.com/cdn-cgi/image/format=jpeg,width=600/https://resim.ertelmarket.com/up/h/c287a4b3de5eb5294794488c.webp" \
                   "https://resim.ertelmarket.com/cdn-cgi/image/format=jpeg,width=600/up/h/c287a4b3de5eb5294794488c.webp"; do
            r=$(curl -s -o /tmp/x -w '%{http_code} %{content_type} %{size_download}' "$u"); echo "::notice title=IMG::$u → $r $(file -b /tmp/x | cut -c1-60)"
          done
