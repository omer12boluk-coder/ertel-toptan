# Günlük kullanım raporu: Firestore okuma/yazma + Cloudflare → meta/usage + Telegram (Ayarlar > Veri ve kota)
name: Günlük kullanım raporu
on:
  schedule:
    - cron: '47 20 * * *' # her gün TR 23:47
  workflow_dispatch:
jobs:
  usage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save --no-package-lock firebase-admin@12
      - name: Rapor
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          WATCH_URL: https://ertel-b2b-watch.omer-12boluk.workers.dev
        run: node tools/usage-report.mjs
